<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:normal;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:transparent;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body class="embed-body">
<title>Domi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell (top bar + one screen at a time). Lobby scrolls; game screens fit the viewport: HUD / felt board / boneyard or hand / controls. */
@property --t { syntax: '<number>'; inherits: true; initial-value: 100; }
:root {
  --bg: #0a1328;
  --bg-2: #0f1c3a;
  --panel: #132349;
  --panel-2: #1a2f5c;
  --line: rgba(160, 190, 255, .14);
  --line-2: rgba(160, 190, 255, .24);
  --text: #eef3ff;
  --muted: #93a5c8;
  --gold: #ffc542;
  --gold-deep: #f29e1f;
  --ember: #ff5b45;
  --mint: #3ddc97;
  --sky: #5aa8ff;
  --felt: #17784c;
  --felt-deep: #0c4a31;
  --ivory: #f7f1de;
  --ivory-2: #efe5c6;
  --ivory-edge: #d8caa2;
  --pip: #1b2030;
  --accent: var(--gold);
  --violet: #a77bff;
  --pink: #ff5fb0;
  --p1: #e2463c; --p2: #ee8a12; --p3: #c99a00; --p4: #279a57; --p5: #2f6fd6; --p6: #8a4fd8; --p7: #d6408c; --p8: #16939f; --p9: #7a4a2a;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --gutter: 16px;
  --r: 18px;
  color-scheme: normal;   /* 'dark' made browsers paint an opaque backdrop behind the embed */
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; container: app / inline-size;
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(23,120,76,.22), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 100%, rgba(90,168,255,.10), transparent 70%),
    linear-gradient(180deg, var(--bg-2), var(--bg));
}

/* ---------- Top bar ---------- */
.topbar {
  flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding-inline: var(--gutter);
  border-bottom: 1px solid var(--line); background: rgba(10,19,40,.6); backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.wordmark {
  font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: .2px; white-space: nowrap;
  background: linear-gradient(180deg, #ffe08a, var(--gold) 45%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.crumb { display: flex; align-items: center; gap: 10px; min-width: 0; }
.crumb h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.icon-btn svg { width: 20px; height: 20px; }
.spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-weight: 700; font-size: 14px; white-space: nowrap;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px var(--mint); }
.wallet { color: var(--gold); }
.badge {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 800;
  letter-spacing: .6px; text-transform: uppercase; background: rgba(255,197,66,.14); color: var(--gold); border: 1px solid rgba(255,197,66,.3);
}
.badge.soon { background: rgba(147,165,200,.12); color: var(--muted); border-color: var(--line); }
.badge.mint { background: rgba(61,220,151,.12); color: var(--mint); border-color: rgba(61,220,151,.3); }

.screen { flex: 1; min-height: 0; position: relative; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 14px;
  border: 1px solid var(--line-2); background: var(--panel-2); font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .3px;
  transition: transform .1s, background .15s, filter .15s, opacity .15s; white-space: nowrap;
}
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { opacity: .45; }
.btn.gold {
  border: 0; color: #3a2100; background: linear-gradient(180deg, #ffd56a, var(--gold) 50%, var(--gold-deep));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 4px 0 #b86e0c, 0 10px 22px rgba(242,158,31,.28);
}
.btn.gold:active:not(:disabled) { box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 #b86e0c; transform: translateY(3px); }
.btn.mint { border: 0; color: #032a1a; background: linear-gradient(180deg, #7af0bd, var(--mint)); box-shadow: 0 4px 0 #1b8a5b; }
.btn.ghost { background: transparent; }
.btn.lg { height: 56px; font-size: 22px; padding: 0 34px; border-radius: 16px; }
.btn.sm { height: 36px; font-size: 15px; padding: 0 14px; border-radius: 11px; }

/* ---------- Dominoes ---------- */
.tile {
  --t: 100; position: relative; flex: none; display: flex; box-sizing: border-box; border-radius: calc(var(--t) * .075px);
  background: linear-gradient(165deg, #fffbee 0%, var(--ivory) 40%, var(--ivory-2) 100%);
  box-shadow: inset 0 0 0 1px var(--ivory-edge), 0 calc(var(--t) * .025px) 0 #c9b98d, 0 calc(var(--t) * .05px) calc(var(--t) * .1px) rgba(0,0,0,.28);
}
.tile.h { width: calc(var(--t) * 1px); height: calc(var(--t) * .5px); flex-direction: row; }
.tile.v { width: calc(var(--t) * .5px); height: calc(var(--t) * 1px); flex-direction: column; }
.tile::before { content: ""; position: absolute; background: rgba(27,32,48,.55); border-radius: 2px; }
.tile.h::before { left: calc(50% - .75px); width: 1.5px; top: 14%; bottom: 14%; }
.tile.v::before { top: calc(50% - .75px); height: 1.5px; left: 14%; right: 14%; }
.tile::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: calc(var(--t) * .05px); height: calc(var(--t) * .05px); transform: translate(-50%, -50%);
  border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #b8a77a 70%);
}
.half { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--t) * .07px); box-sizing: border-box; }
.half i { width: calc(var(--t) * .088px); height: calc(var(--t) * .088px); border-radius: 50%; place-self: center; background: var(--pip); box-shadow: inset 0 calc(var(--t) * .01px) calc(var(--t) * .012px) rgba(255,255,255,.18); }
.half.wild { display: grid; grid-template: 1fr / 1fr; place-items: center; padding: 0; }
.half.wild svg { width: 62%; height: 62%; }
.tile.back { background: linear-gradient(165deg, #fffbee 0%, var(--ivory) 45%, var(--ivory-2) 100%); }
.tile.back::before { inset: calc(var(--t) * .045px); width: auto; height: auto; left: calc(var(--t) * .045px); right: calc(var(--t) * .045px); top: calc(var(--t) * .045px); bottom: calc(var(--t) * .045px); background: none; border: 1px solid var(--ivory-edge); border-radius: calc(var(--t) * .05px); }
.tile.back::after { width: calc(var(--t) * .17px); height: calc(var(--t) * .17px); border-radius: 3px; background: none; border: 1.5px solid #c8a24a; transform: translate(-50%, -50%) rotate(45deg); box-shadow: inset 0 0 0 calc(var(--t) * .03px) var(--ivory), inset 0 0 0 calc(var(--t) * .06px) rgba(200,162,74,.85); }
.tile.ghost { background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.09); }
.tile.ghost::before, .tile.ghost::after { display: none; }

/* ---------- Lobby ---------- */
#lobby { overflow-y: auto; }
.lobby-inner { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 24px 48px; display: grid; gap: 32px; }
.hero {
  position: relative; overflow: hidden; border-radius: 26px; padding: clamp(20px, 4cqw, 44px); border: 1px solid var(--line);
  background:
    radial-gradient(ellipse 60% 80% at 85% 50%, rgba(255,197,66,.16), transparent 60%),
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 1.5px) 0 0 / 22px 22px,
    linear-gradient(135deg, var(--felt) 0%, var(--felt-deep) 75%);
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 24px; align-items: center;
}
.hero .eyebrow { font-weight: 800; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #bff5d9; }
.hero h2 {
  margin: 6px 0 4px; font-family: var(--display); font-weight: 800; font-size: clamp(38px, 8.5cqw, 76px); line-height: .95; text-wrap: balance;
  background: linear-gradient(180deg, #fff1b8, var(--gold) 50%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0,0,0,.18));
}
.hero .tag { font-family: var(--display); font-weight: 600; font-size: clamp(17px, 2.4cqw, 24px); color: #fff; }
.hero p { margin: 10px 0 20px; color: #d3efe1; max-width: 46ch; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hero-art { position: relative; height: 240px; }
.hero-art .tile { position: absolute; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; }
.section-head p { margin: 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card {
  display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: var(--r); border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel-2), var(--panel)); min-width: 0;
}
.card .art { height: 92px; border-radius: 12px; background: linear-gradient(135deg, var(--felt), var(--felt-deep)); display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; overflow: hidden; }
.card h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; }
.card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
.seg button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.library { display: grid; gap: 8px; }
.lib-item { border: 1px solid var(--line); border-radius: 14px; background: rgba(19,35,73,.6); overflow: hidden; }
.lib-item summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; flex-wrap: wrap; }
.lib-item summary::-webkit-details-marker { display: none; }
.lib-item summary b { font-family: var(--display); font-weight: 700; font-size: 18px; margin-right: auto; }
.lib-item summary .chev { transition: transform .2s; color: var(--muted); }
.lib-item[open] summary .chev { transform: rotate(180deg); }
.lib-item .body { padding: 0 16px 16px; color: #c9d5ee; display: grid; gap: 6px; max-width: 80ch; }
.lib-item .body p { margin: 0; }
.foot { color: var(--muted); font-size: 13px; text-align: center; }

/* ---------- Game screens shared ---------- */
.game { display: flex; flex-direction: column; gap: 12px; padding-inline: var(--gutter); padding-block: 12px; height: 100%; box-sizing: border-box; }
.hud { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; justify-content: center; min-width: 84px; padding: 6px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.stat small { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
.stat b { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.gold b { color: var(--gold); }
.stat.win b { color: var(--mint); }
.misses { display: flex; gap: 5px; align-items: center; }
.misses span { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.12); transition: background .2s, box-shadow .2s; }
.misses span.on { background: var(--ember); box-shadow: 0 0 10px rgba(255,91,69,.8); }
.streak { color: var(--muted); }
.streak.hot { color: #ffb36b; border-color: rgba(255,140,60,.45); background: rgba(255,120,40,.12); }
.streak svg { width: 16px; height: 16px; }

.board {
  position: relative; flex: 1; min-height: 180px; border-radius: 22px; overflow: hidden; border: 1px solid rgba(255,255,255,.08);
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, rgba(255,255,255,.07), transparent 70%),
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.045) 1px, transparent 1.5px) 0 0 / 20px 20px,
    linear-gradient(160deg, var(--felt), var(--felt-deep));
  box-shadow: inset 0 2px 30px rgba(0,0,0,.25);
}
.track { position: absolute; inset: 0; }
.track .tile { position: absolute; transition: left .45s cubic-bezier(.3,.7,.3,1), top .45s cubic-bezier(.3,.7,.3,1), --t .45s; }
.track .tile.pop { animation: pop .6s ease-out; }
@keyframes pop { 0% { filter: drop-shadow(0 0 0 rgba(255,214,90,0)); } 30% { filter: drop-shadow(0 0 14px rgba(255,214,90,.95)); } 100% { filter: drop-shadow(0 0 0 rgba(255,214,90,0)); } }
.status {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 24px); box-sizing: border-box;
  max-width: calc(100% - 140px); padding: 8px 16px; border-radius: 999px; background: rgba(6,24,16,.55); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.1);
  font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 4;
}
.ends { position: absolute; bottom: 10px; display: flex; align-items: center; gap: 8px; z-index: 4; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.7); }
.ends.l { left: 12px; } .ends.r { right: 12px; flex-direction: row-reverse; }
.endface { width: 46px; height: 46px; border-radius: 10px; background: var(--ivory); box-shadow: inset 0 0 0 1px var(--ivory-edge), 0 3px 8px rgba(0,0,0,.3); display: flex; --t: 92; transition: transform .25s, box-shadow .25s; }
.endface .half { padding: 7px; }
.endface.bump { transform: scale(1.15); }
.endface.wild { box-shadow: inset 0 0 0 1px var(--ivory-edge), 0 0 0 3px rgba(255,197,66,.7); }

/* toasts */
.toasts { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; z-index: 8; pointer-events: none; width: max-content; max-width: calc(100% - 24px); }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 999px; background: rgba(13,24,52,.92); border: 1px solid var(--line-2);
  box-shadow: 0 8px 24px rgba(0,0,0,.3); font-weight: 700; font-size: 14px; animation: toastIn .35s cubic-bezier(.2,1.2,.4,1) both;
}
.toast .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 14px; background: var(--gold); color: #3a2100; flex: none; }
.toast.mint .ic { background: var(--mint); color: #032a1a; }
.toast.ember .ic { background: var(--ember); color: #fff; }
.toast.out { animation: toastOut .3s ease-in both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.95); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

/* win card: clean, no scrim */
.wincard {
  position: absolute; left: 50%; top: 50%; z-index: 9; width: min(360px, calc(100% - 32px)); box-sizing: border-box; padding: 22px 24px 20px; border-radius: 22px; text-align: center;
  background: linear-gradient(180deg, #1c3566, #142851); border: 1px solid rgba(255,197,66,.45);
  box-shadow: 0 18px 40px rgba(4,10,30,.35);
  transform: translate(-50%, -50%) scale(.9); opacity: 0; transition: opacity .25s, transform .35s cubic-bezier(.2,1.3,.4,1); pointer-events: none;
}
.wincard.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.wincard .k { font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
.wincard .amt { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1; margin: 6px 0 2px; color: #fff; font-variant-numeric: tabular-nums; }
.wincard .sub { color: var(--muted); font-weight: 600; }
.wincard ul { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 14px; text-align: left; }
.wincard li { display: flex; justify-content: space-between; gap: 12px; }
.wincard li span:last-child { font-weight: 800; color: var(--mint); font-variant-numeric: tabular-nums; }
.wincard .row { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

/* paytable shelf */
.shelf-tab {
  position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 8px; border: 1px solid rgba(255,255,255,.14); border-left: 0; border-radius: 0 14px 14px 0; background: rgba(10,19,40,.75); backdrop-filter: blur(8px);
}
.shelf-tab .lbl { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 800; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.shelf-tab .tier { font-family: var(--display); font-weight: 800; font-size: 16px; color: var(--gold); line-height: 1; }
.shelf {
  position: absolute; left: 0; top: 0; bottom: 0; width: min(300px, 82%); z-index: 7; box-sizing: border-box; display: flex; flex-direction: column;
  background: rgba(10,19,40,.94); backdrop-filter: blur(10px); border-right: 1px solid var(--line-2);
  transform: translateX(-102%); transition: transform .32s cubic-bezier(.3,.8,.3,1);
}
.shelf.open { transform: none; }
.shelf header { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px 18px; }
.shelf header b { font-family: var(--display); font-weight: 800; font-size: 20px; }
.shelf header small { display: block; color: var(--muted); font-size: 12px; }
.ptable { flex: 1; overflow-y: auto; padding: 0 10px 12px; display: grid; align-content: start; gap: 2px; }
.prow { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 10px; font-weight: 700; font-variant-numeric: tabular-nums; color: #c9d5ee; transition: background .2s, color .2s; }
.prow span:last-child { color: var(--text); }
.prow.hit { color: var(--gold); }
.prow.top { background: rgba(255,197,66,.16); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(255,197,66,.35); }
.prow.next { background: rgba(255,255,255,.05); }
.shelf .bon { padding: 12px 18px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.shelf .bon b { color: var(--text); }

/* boneyard */
.yard { flex: none; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 12px; }
.yard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.yard-head h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .3px; }
.yard-head span { color: var(--muted); font-weight: 700; font-size: 13px; }
.cells { display: grid; gap: var(--gap, 8px); justify-content: center; }
.cell { --t: 60; position: relative; width: calc(var(--t) * .5px); height: calc(var(--t) * 1px); padding: 0; border: 0; background: none; perspective: 600px; }
.cell .slot { position: absolute; inset: 0; border-radius: calc(var(--t) * .075px); background: rgba(255,255,255,.045); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.08); }
.cell .card3 { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .36s cubic-bezier(.3,.7,.3,1), translate .15s; }
.cell .card3 > .tile { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.cell .card3 > .face { transform: rotateY(180deg); }
.cell.up .card3 { transform: rotateY(180deg); }
.cell:not(:disabled):hover .card3 { translate: 0 -4px; }
.cell.gone .card3 { visibility: hidden; }
.cell.miss .face { box-shadow: inset 0 0 0 2px var(--ember), 0 0 0 2px rgba(255,91,69,.35); }
.cell.miss .face .half i { background: #8a2a20; }
.cell.dim .face { opacity: .6; }
.cell.shake .card3 { animation: shake .4s; }
@keyframes shake { 20% { translate: -5px 0; } 40% { translate: 5px 0; } 60% { translate: -3px 0; } 80% { translate: 3px 0; } }

/* controls */
.controls { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.controls .grp { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 0; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); height: 46px; }
.stepper button { width: 42px; height: 44px; border: 0; background: none; font-size: 22px; font-weight: 700; border-radius: 12px; }
.stepper button:disabled { opacity: .35; }
.stepper .val { min-width: 74px; text-align: center; line-height: 1.05; }
.stepper .val small { display: block; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
.stepper .val b { font-family: var(--display); font-size: 19px; font-variant-numeric: tabular-nums; }
.seg.denom button { height: 38px; font-size: 14px; padding: 0 14px; }
#dPlay.pulse { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 4px 0 #b86e0c, 0 0 0 6px rgba(255,197,66,.22), 0 10px 26px rgba(242,158,31,.45); } }

/* line + train tables */
.opp { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; z-index: 4; flex-wrap: wrap; }
.opp .who { font-weight: 800; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,.75); }
.opp .mini { display: flex; gap: 3px; }
.hand-wrap { flex: none; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 10px; }
.hand-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hand-head h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 18px; margin-right: auto; }
.hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 40px; }
.hand .pick { padding: 0; border: 0; background: none; border-radius: 10px; transition: transform .15s, filter .15s, opacity .15s; }
.hand .pick.ok { transform: translateY(-6px); filter: drop-shadow(0 6px 10px rgba(61,220,151,.45)); }
.hand .pick.ok .tile { box-shadow: inset 0 0 0 2px var(--mint), 0 4px 0 #c9b98d; }
.hand .pick.no { opacity: .55; }
.hand .pick.sel .tile { box-shadow: inset 0 0 0 3px var(--gold), 0 4px 0 #c9b98d; }
.chooser { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.scoreline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.trains { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 50px 14px 56px; box-sizing: border-box; }
.trow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.trow .lab { flex: none; width: 92px; display: flex; flex-direction: column; gap: 3px; }
.trow .lab b { font-size: 13px; font-weight: 800; }
.trow .lab small { font-size: 11px; color: rgba(255,255,255,.7); font-weight: 700; }
.trow .lab .mk { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--gold); text-transform: uppercase; }
.trow .line { display: flex; align-items: center; gap: 3px; min-width: 0; flex-wrap: nowrap; padding: 4px; border-radius: 10px; flex: 1; overflow: hidden; }
.trow.target .line { background: rgba(255,197,66,.14); box-shadow: inset 0 0 0 1.5px rgba(255,197,66,.6); cursor: pointer; }
.trow.mex .lab b { color: var(--gold); }

/* sheets */
.sheet-wrap { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: var(--gutter); background: rgba(4,9,24,.55); backdrop-filter: blur(4px); }
.sheet { width: min(720px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; border-radius: 22px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 30px 70px rgba(0,0,0,.45); }
.sheet header { position: sticky; top: 0; display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1; }
.sheet header h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; margin-right: auto; }
.sheet .content { padding: 18px 22px 24px; display: grid; gap: 18px; }
.sheet h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--gold); }
.sheet ul, .sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: #d6e0f5; }
.sheet p { margin: 0; color: #d6e0f5; }
.sheet .note { font-size: 13px; color: var(--muted); }
.ptgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ptgrid div { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 9px; background: rgba(255,255,255,.04); font-weight: 700; font-variant-numeric: tabular-nums; }

.result {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; width: min(380px, calc(100% - 32px)); box-sizing: border-box;
  padding: 22px; border-radius: 22px; text-align: center; background: linear-gradient(180deg, #1c3566, #142851); border: 1px solid var(--line-2); box-shadow: 0 18px 40px rgba(4,10,30,.35);
}
.result h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; }
.result p { margin: 6px 0 0; color: var(--muted); }
.result table { width: 100%; margin-top: 12px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.result td { padding: 5px 4px; border-top: 1px solid var(--line); text-align: left; }
.result td:last-child { text-align: right; font-weight: 800; }
.result .row { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

.flyer { position: absolute; left: 0; top: 0; z-index: 50; pointer-events: none; }

@container app (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .hero-art { height: 150px; order: -1; }
  .topbar { height: 54px; gap: 8px; }
  .wordmark { font-size: 19px; }
  .stat { min-width: 0; padding: 5px 10px; }
  .stat b { font-size: 18px; }
  .game { gap: 10px; padding-block: 10px; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Color variation ---------- */

.colorpips .half.p4 i { background: var(--p4); } .colorpips .half.p5 i { background: var(--p5); } .colorpips .half.p6 i { background: var(--p6); }

.card .art { background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1.5px) 0 0 / 16px 16px, linear-gradient(135deg, var(--felt), var(--felt-deep)); }

#dHot.hot { color: #ff8fca; border-color: rgba(255,95,176,.45); background: rgba(255,95,176,.12); }
.app {
  background:
    radial-gradient(ellipse 60% 40% at 0% 0%, rgba(167,123,255,.16), transparent 70%),
    radial-gradient(ellipse 70% 45% at 100% 30%, rgba(69,227,211,.10), transparent 70%),

/* ---------- Presentation page: phone frame + toolkit ---------- */
.page {
  height: 100%; display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse 50% 50% at 15% 20%, rgba(167,123,255,.14), transparent 70%),
    radial-gradient(ellipse 50% 50% at 85% 80%, rgba(26,132,84,.18), transparent 70%),
    radial-gradient(ellipse 40% 40% at 90% 10%, rgba(255,176,58,.08), transparent 70%),
    #070d1d;
}
.page-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-inline: var(--gutter); padding-block: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ph-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.tabs { display: inline-flex; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.tabs button { border: 0; background: none; height: 36px; padding: 0 18px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--muted); }

.page-main { flex: 1; min-height: 0; overflow: auto; }
.proto { min-height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 64px; padding-inline: var(--gutter); padding-block: 20px; }
.phone-slot { --s: 1; flex: none; position: relative; width: calc(414px * var(--s)); height: calc(868px * var(--s)); }
.phone {
  position: absolute; left: 0; top: 0; width: 414px; height: 868px; box-sizing: border-box; padding: 12px; border-radius: 62px;
  transform: scale(var(--s)); transform-origin: 0 0;
  background: linear-gradient(150deg, #3a3f4c 0%, #1a1d25 40%, #0e1016 100%);
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 0 0 6px #0b0d12, 0 0 0 1px #000;
}
.glass { width: 390px; height: 844px; border-radius: 50px; overflow: hidden; position: relative; background: var(--bg); isolation: isolate; }
.page.bare .proto { padding: 0; display: block; height: 100%; min-height: 0; }

.proto-notes { max-width: 330px; display: grid; gap: 18px; }

.proto-notes li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--gold)); transform: translateY(-1px); }
.felts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.felts div { height: 52px; border-radius: 12px; display: flex; align-items: flex-end; padding: 6px 8px; box-sizing: border-box; font-size: 11px; font-weight: 800; letter-spacing: .5px; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
@media (max-width: 1000px) { .proto-notes { display: none; } }

.kit-inner { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 28px 64px; display: grid; gap: 8px; }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sw { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); min-width: 0; }

.theme { border-radius: 18px; padding: 16px; min-height: 150px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }

.row-wrap { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

.pips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }

.kit-panel { position: relative; padding: 20px; border-radius: 18px; background: linear-gradient(160deg, var(--felt, #1a8454), var(--felt-deep, #0b4a31)); }
.wincard.static, .result.static { position: relative; left: auto; top: auto; transform: none; opacity: 1; pointer-events: auto; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }

.buy { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.buy-art { padding: 8px 12px; }
.buy-copy { display: grid; gap: 10px; }

}

}

.tile.back.bk-cobalt { background: repeating-linear-gradient(135deg, #2a72d8 0 calc(var(--t) * .05px), #1a4b9c calc(var(--t) * .05px) calc(var(--t) * .1px)); }

  background: linear-gradient(90deg, rgba(255,226,196,.85) 0 13%, transparent 13% 87%, rgba(255,226,196,.85) 87%), repeating-linear-gradient(0deg, rgba(255,226,196,.55) 0 calc(var(--t) * .022px), transparent calc(var(--t) * .022px) calc(var(--t) * .07px)); }

.tile.back.bk-sun { background: radial-gradient(circle, #fff6c2 0 12%, #ffc542 13% 19%, rgba(255,140,30,0) 20%), repeating-conic-gradient(from 0deg, #ffb21e 0 10deg, #ff7a1a 10deg 20deg); }

.tile.back.bk-marble { background:
  linear-gradient(118deg, transparent 37%, rgba(255,197,66,.9) 38.2%, transparent 39.6%),

  radial-gradient(circle, #ffc542 0 8%, transparent 9%) 0 0 / 50% 25%,

.tile.back.bk-talavera::before { border-color: #2f56c4; }
.tile.back.bk-talavera::after { display: none; }
.tile.back.bk-velvet { background: radial-gradient(circle at 50% 50%, transparent 0 27%, rgba(255,197,66,.6) 29% 32%, transparent 34%) 0 0 / 50% 25%, linear-gradient(160deg, #7434b8, #2c0e50); }
.tile.back.bk-velvet::before { border-color: rgba(255,197,66,.7); }
.tile.back.bk-velvet::after { border-color: #ffc542; box-shadow: inset 0 0 0 calc(var(--t) * .03px) #4a1f7a, inset 0 0 0 calc(var(--t) * .06px) #ffc542; }
.felt-back { height: auto !important; background: none !important; box-shadow: none !important; justify-content: center; padding: 0 !important; }
.head-link { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); color: var(--text); text-decoration: none; font-weight: 800; font-size: 14px; background: rgba(255,255,255,.04); }
.head-link:hover { background: rgba(255,255,255,.08); }
.page.embed { background: transparent; }
body.embed-body { background: transparent; }
.page.embed .proto { padding: 8px; gap: 0; }
.kit-backs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.kb { display: grid; justify-items: center; gap: 8px; padding: 16px 10px 14px; border-radius: 16px; text-align: center; border: 1px solid var(--line);
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--rar) 18%, transparent), transparent 70%), var(--panel); }
.kb b { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.1; }
.kb small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.yard { grid-template-columns: minmax(0, 1fr); } .cells { min-width: 0; }

/* ---------- Settings ---------- */
.settings { display: grid; gap: 4px; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.setrow:last-child { border-bottom: 0; }
.setrow b { display: block; font-size: 16px; }
.setrow small { display: block; color: var(--muted); font-size: 13px; }
.switch { appearance: none; -webkit-appearance: none; flex: none; width: 50px; height: 30px; border-radius: 99px; background: rgba(255,255,255,.14); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .2s; }
.switch:checked { background: var(--mint); }
.switch:checked::after { transform: translateX(20px); }
#tbMusic[aria-pressed="true"] { color: var(--pink); border-color: rgba(255,95,176,.4); }

/* ---------- Character portraits ---------- */
.cport { position: relative; flex: none; border-radius: 22%; overflow: hidden; box-sizing: border-box;
  background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.38), transparent 55%), repeating-conic-gradient(from 0deg at 50% 70%, rgba(255,255,255,.07) 0 10deg, transparent 10deg 20deg), linear-gradient(160deg, var(--c), var(--cd));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), inset 0 -10px 18px rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.3); }
.cport svg { position: absolute; left: 4%; top: 6%; width: 92%; height: 100%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.tport { position: relative; flex: none; border-radius: 22%; display: grid; place-items: center; align-content: center; gap: 4px; color: #fff; box-sizing: border-box;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.3), transparent 55%), linear-gradient(160deg, var(--c), var(--cd)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.2), 0 6px 14px rgba(0,0,0,.3); }
.tport > svg:first-child { width: 34%; height: 34%; }
.tport b { font-size: 10px; letter-spacing: 1px; font-weight: 800; opacity: .85; }
.tport .eq { display: flex; gap: 3px; align-items: flex-end; height: 14%; }
.tport .eq i { width: 4px; background: #fff; border-radius: 2px; height: 40%; opacity: .85; }
.tport .eq i:nth-child(2) { height: 100%; } .tport .eq i:nth-child(3) { height: 65%; } .tport .eq i:nth-child(4) { height: 85%; }
.tport.sfx .wave { width: 60%; height: 16%; }
.tport.sfx { color: #fff; }
.tb-avatar { flex: none; padding: 0; border: 0; background: none; border-radius: 12px; }
.tb-avatar .cport { border-radius: 12px; }

/* ---------- Lobby style row ---------- */
.style-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.style-card { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border-radius: 20px; border: 1px solid var(--line); min-width: 0;
  background: linear-gradient(135deg, var(--panel-2), var(--panel)); transition: transform .15s, border-color .15s; }
.style-card:hover { transform: translateY(-2px); border-color: var(--line-2); }
.style-card.sc-chars { background: radial-gradient(ellipse 70% 100% at 0% 50%, rgba(255,197,66,.2), transparent 70%), linear-gradient(135deg, #2a2350, #142349); }
.style-card.sc-backs { background: radial-gradient(ellipse 70% 100% at 0% 50%, rgba(167,123,255,.22), transparent 70%), linear-gradient(135deg, #1d1f52, #142349); }
.style-card.sc-music { background: radial-gradient(ellipse 70% 100% at 0% 50%, rgba(255,95,176,.2), transparent 70%), linear-gradient(135deg, #2d1a46, #142349); }
.sc-art { flex: none; display: grid; place-items: center; min-width: 72px; }
.sc-copy { display: grid; gap: 3px; min-width: 0; }
.sc-copy b { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.sc-copy small { color: var(--muted); font-size: 13px; }
.sc-copy .chip { justify-self: start; height: 26px; font-size: 12px; margin-top: 4px; }

/* ---------- Character select ---------- */
.char-hero { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding: 22px; border-radius: 24px; overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: radial-gradient(ellipse 60% 90% at 15% 50%, color-mix(in srgb, var(--c) 40%, transparent), transparent 70%), linear-gradient(135deg, color-mix(in srgb, var(--cd) 70%, #0f1c3a), var(--panel)); }
.char-hero::before { content: ""; position: absolute; left: -10%; top: -30%; width: 46%; height: 160%; transform: skewX(-14deg); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 30%, transparent), transparent); pointer-events: none; }
.ch-art { position: relative; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(-1.5deg); } }
.ch-copy { position: relative; display: grid; gap: 8px; }
.ch-copy h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }
.ch-copy p { margin: 0; color: #d6e0f5; }
.ch-copy .quote { font-family: var(--display); font-weight: 700; font-size: 18px; color: #fff; }
.ch-copy .move b { color: var(--c); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; margin-right: 6px; }
.row-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bc-act.row-act { justify-items: start; }
.lockpin.big { width: 40px; height: 40px; right: 4px; bottom: 4px; }
.lockpin.big svg { width: 20px; height: 20px; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.rtile { position: relative; display: grid; justify-items: center; gap: 6px; padding: 10px 6px 10px; border-radius: 18px; border: 2px solid transparent; background: rgba(255,255,255,.04); transition: transform .15s, border-color .15s; }
.rtile:hover { transform: translateY(-3px); }
.rtile.focus { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.rtile.locked .cport { filter: saturate(.6) brightness(.8); }
.rtile .rname { font-family: var(--display); font-weight: 700; font-size: 14px; line-height: 1.1; text-align: center; }
.rtile .lockpin { right: 6px; bottom: 34px; }
.rtile .rtier { position: absolute; left: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px #0a1328; }
.rtier.t-free { background: var(--muted); } .rtier.t-earn { background: var(--mint); } .rtier.t-buy { background: var(--pink); }
.rtile.is-eq::after { content: "Selected"; position: absolute; right: 6px; top: 6px; font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 3px 6px; border-radius: 99px; background: var(--c); color: #1a1030; }
.sound-tabs { justify-self: stretch; display: grid; grid-template-columns: 1fr 1fr; }
.sound-tabs button { height: 40px; font-size: 14px; }
@container app (max-width: 520px) {
  .char-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 18px; gap: 12px; }
  .char-hero .meta, .char-hero .row-act { justify-content: center; }
  .ch-art .cport { width: 150px !important; height: 150px !important; }
  .roster { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .rtile { padding: 6px 2px 8px; border-radius: 14px; }
  .rtile .cport { width: 68px !important; height: 68px !important; }
  .rtile .rname { font-size: 11px; }
  .rtile .lockpin { width: 22px; height: 22px; bottom: 30px; right: 2px; }
  .rtile.is-eq::after { font-size: 7px; padding: 2px 4px; }
}

/* ---------- Character on the table ---------- */
.avatar { position: absolute; right: 12px; top: 10px; z-index: 5; display: flex; align-items: flex-start; gap: 8px; pointer-events: none; }
.avatar .cport { border-radius: 16px; }
.avatar.react .cport { animation: hop .5s cubic-bezier(.3,1.6,.5,1); }
.avatar.sad .cport { animation: wobble .5s ease; }

/* ---------- Snake path for a felt board ---------- */
function snake(W, H, need, pad) {
  const aw = W - pad.l - pad.r, ah = H - pad.t - pad.b;
  const maxL = Math.min(150, ah * 1.2, aw / 2.2);
  let best = null;
  for (let L = Math.floor(maxL); L >= 22; L -= 2) {

    const pitch = S + L; if (ah < S) continue;

/* ---------- Audio files: sound/sfx/<pack>/<name>.mp3 and sound/music/<track>.mp3 ----------
   Files load on demand. Until a file is ready (or if it can't load, e.g. opened from disk),
   the built-in synth plays instead. To swap in new audio, replace the file with the same name. */
const SOUND_PATH = 'sound/';
const SFX_FILE_GAIN = 0.068;   // rendered files are normalized; this matches the original synth level
const MUSIC_FILE_GAIN = 0.45;
const AudioFiles = (() => {
  const bufs = {}, pending = {};
  const ctx = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return ac; };
  function load(name) {
    if (bufs[name] || pending[name] || location.protocol === 'file:') return pending[name] || Promise.resolve(bufs[name] || null);
    const c = ctx(); if (!c) return Promise.resolve(null);
    pending[name] = fetch(SOUND_PATH + name + '.mp3').then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(b => new Promise((ok, no) => c.decodeAudioData(b, ok, no)))
      .then(b => (bufs[name] = b)).catch(() => (bufs[name] = false)).finally(() => { delete pending[name]; });
    return pending[name];
  }
  function play(name, rate = 1) {
    const b = bufs[name]; if (!b) { load(name); return false; }
    const c = ctx(); if (c.state === 'suspended') c.resume();
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; s.playbackRate.value = rate; g.gain.value = SFX_FILE_GAIN;
    s.connect(g).connect(c.destination); s.start(); return true;
  }
  const SFX_NAMES = ['click', 'flip', 'place', 'hit', 'miss', 'tier', 'win', 'tick'];
  const preloadPack = (id = S.sfxPack) => SFX_NAMES.forEach(n => load(`sfx/${id}/${n}`));
  return { load, play, get: (n) => bufs[n], preloadPack };
})();
const synthSfx = Object.assign({}, sfx);
Object.keys(synthSfx).forEach(k => {
  sfx[k] = (n = 0) => {
    if (!S.sound) return;
    const rate = k === 'hit' ? (440 + n * 18) / 440 : 1;   // hits rise in pitch with the streak, like the synth
    if (!AudioFiles.play(`sfx/${sfxPack().id}/${k}`, rate)) synthSfx[k](n);
  };
});

/* ---------- Progress and unlocks ---------- */
function bump(stat, v, mode = 'add') {
  S.stats[stat] = mode === 'max' ? Math.max(S.stats[stat] || 0, v) : (S.stats[stat] || 0) + v;
  store.set('stats', S.stats);
  checkUnlocks();
}
const progressOf = (b) => b.goal ? Math.min(S.stats[b.goal.stat] || 0, b.goal.n) : 0;
function checkUnlocks() {
  Object.entries(KINDS).forEach(([kind, K]) => K.items.forEach(item => {
    if (!item.goal || S[K.own].includes(item.id)) return;
    if ((S.stats[item.goal.stat] || 0) >= item.goal.n) {
      S[K.own].push(item.id); store.set(K.own, S[K.own]);
      appToast(kind, item);
      sfx.tier();
    }
  }));
}
function appToast(kind, item) {
  const K = KINDS[kind], host = $('#appToasts');
  const t = document.createElement('div');
  t.className = 'toast unlock';
  t.innerHTML = `<span class="mini-back">${K.art(item, 40)}</span><span><small>${item.tier === 'earn' ? 'Exclusive · earned' : 'Earned'}</small>Unlocked: ${item.name}</span><button class="btn sm gold" type="button">${kind === 'chars' ? 'Select' : 'Equip'}</button>`;
  host.appendChild(t);
  t.querySelector('button').onclick = () => { equip(kind, item.id); t.remove(); };
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 5200);
}
function equip(kind, id) {
  const K = KINDS[kind];
  S[K.eq] = id; store.set(K.eq, id); sfx.click();
  if (kind === 'sfx') AudioFiles.preloadPack(id);
  if (kind === 'backs') $$('.app .tile.back').forEach(el => { el.className = el.className.replace(/bk-[a-z]+/g, '').replace(/\s+/g, ' '); const b = BACKS.find(x => x.id === id); el.classList.add('bk-' + id); if (b.dark) el.classList.add('bk-dark'); });
  if (kind === 'music') Music.setTrack(id);
  if (kind === 'chars') Avatar.refresh();
  if (current === 'collect') Collection.render();
}
function topbar() {

  const R = RULES[id]();
  const sec = R.sections.map(s => {
    if (s.note) return `<p class="note">${s.note}</p>`;
    let body = '';
    if (s.p) body = `<p>${s.p}</p>`;
    if (s.ul) body = `<ul>${s.ul.map(x => `<li>${x}</li>`).join('')}</ul>`;
    if (s.ol) body = `<ol>${s.ol.map(x => `<li>${x}</li>`).join('')}</ol>`;
    if (s.pt) body = `<div class="ptgrid">${s.pt.map(([n, p]) => `<div><span>${n}+ tiles</span><span>${p}×</span></div>`).join('')}</div>`;
    return `<section><h3>${s.h}</h3>${body}</section>`;
  }).join('');
  sheet(R.title, sec);
}

          const count = k === 'music' ? `${S.ownedMusic.length + S.ownedSfx.length} of ${TRACKS.length + SFX_PACKS.length}` : `${S[K.own].length} of ${K.items.length}`;
          return `<button class="style-card sc-${k}" data-collect="${k}"><span class="sc-art">${K.art(cur, k === 'backs' ? 84 : 72)}</span><span class="sc-copy"><span class="eyebrow2">${t}</span><b>${cur.name}</b><small>${sub}</small><span class="chip">${count} unlocked</span></span></button>`;
        }).join('')}
      </section>

      <section style="display:grid;gap:14px">
        <div class="section-head"><h3>Classic tables</h3><p>Play against the computer with a double-six or double-nine set.</p></div>
        <div class="grid">${GAMES.filter(g => g.id !== 'domi').map(g => `
          <article class="card" style="${themeVars(g.id)}">
            <div class="art" aria-hidden="true">${art(g)}</div>
            <div style="display:grid;gap:6px"><h4>${g.name}</h4><div class="meta"><span class="badge acc">Playable</span><span class="badge soon">${g.players}</span></div></div>
            <p>${g.blurb}</p>
            ${seg(g.id)}
            <div class="row"><button class="btn gold" data-play="${g.id}">Play</button><button class="btn ghost" data-rules="${g.id}">Rules</button></div>
          </article>`).join('')}
        </div>
      </section>

      <section style="display:grid;gap:14px">
        <div class="section-head"><h3>Rules library</h3><p>More games for double-six and double-nine sets.</p></div>
        <div class="library">${LIBRARY.map(g => `
          <details class="lib-item"><summary><b>${g.n}</b><span class="badge">${g.set}</span><span class="badge soon">${g.pl} players</span><span class="badge soon">Coming soon</span><span class="chev">${ICON.chev}</span></summary>
          <div class="body">${g.r.map(x => `<p>${x}</p>`).join('')}</div></details>`).join('')}
        </div>
      </section>
      <p class="foot">Game design &amp; art · Jaison Rivera Creative Studio · Playable prototype with demo credits only</p>
    </div>`;
    $$('[data-set]', el).forEach(b => b.onclick = () => { this.sets[b.dataset.g] = +b.dataset.set; store.set('sets', this.sets); sfx.click(); $$(`[data-g="${b.dataset.g}"]`, el).forEach(x => x.setAttribute('aria-pressed', +x.dataset.set === +b.dataset.set)); });
    $$('[data-rules]', el).forEach(b => b.onclick = () => openRules(b.dataset.rules));
    $$('[data-collect]', el).forEach(b => b.onclick = () => { sfx.click(); go('collect', { kind: b.dataset.collect }); });
    $$('[data-play]', el).forEach(b => b.onclick = () => {
      sfx.click();
      const id = b.dataset.play, g = GAMES.find(x => x.id === id), set = setOf(id);
      go(g.kind === 'domi' ? 'domi' : g.kind === 'trains' ? 'trains' : 'table', { id, set });
    });
  },
};

/* =========================================================
   Boneyard Run
   ========================================================= */
const BoneyardRun = (() => {
  let cfg, set, bet = store.get('bet', 20), inRound = false, busy = false;
  let session = 0, misses = 0, streak = 0, winStreak = 0, wildsInTrain = 0, bonuses = [], lastWin = 0, track, yard = [], tierIdx = -1;
  const el = () => $('#domi');
  const credits = () => S.credits;
  const payFor = (n) => { let p = 0; for (const [t, v] of cfg.pay) if (n >= t) p = v; return p; };
  const tierOf = (n) => { let i = -1; cfg.pay.forEach(([t], k) => { if (n >= t) i = k; }); return i; };

  function open(s) {
    session++; set = s; cfg = DIN[s]; inRound = false; busy = false; misses = 0; streak = 0; winStreak = 0; lastWin = 0;
    el().innerHTML = `<div class="game">
      ${hudPanel([
        ['Credits', '<b id="dCredits"></b>', 'gold'], ['Bet', '<b id="dBetStat"></b>', 'sky'], ['Win', '<b id="dWin">0</b>', 'win'],
        ['Streak', `<b class="ic">${ICON.flame}<span id="dStreakN">0</span></b>`, 'streakcell', 'dStreak'], ['Hot hand', '<b id="dHotN">0</b>', 'hotcell', 'dHot'],
        ['Misses', `<span class="misses" id="dMisses">${'<span></span>'.repeat(cfg.misses)}</span>`, ''],
      ])}
      <div class="board" id="dBoard">
        <div class="track" id="dTrack"></div>
        <button class="shelf-tab" id="dTab" aria-expanded="false" aria-controls="dShelf"><span class="tier" id="dTier">${cfg.pay[0][0]}</span><span class="lbl">Paytable</span></button>
        <aside class="shelf" id="dShelf" aria-label="Paytable">
          <header><div><b>Paytable</b><small>Train length · pays × bet</small></div><button class="icon-btn" id="dShelfClose" aria-label="Close paytable">${ICON.close}</button></header>
          <div class="ptable" id="dPT">${[...cfg.pay].reverse().map(([n, p]) => `<div class="prow" data-n="${n}"><span>${n} tiles</span><span>${p}×</span></div>`).join('')}</div>
          <div class="bon"><span><b>Streak</b> ${cfg.streak[0][0]} in a row +${cfg.streak[0][1]}× · ${cfg.streak[1][0]} in a row +${cfg.streak[1][1]}×</span><span><b>Wild pair</b> +${WILD_PAIR}×</span><span><b>Hot hand</b> 3 / 5 / 10 paying trains +2× / +5× / +25×</span></div>
        </aside>
        <div class="toasts" id="dToasts" aria-live="polite"></div>
        <div class="ends l"><div class="endface" id="dEndL"></div><span class="hide-sm">Left end</span></div>
        <div class="ends r"><div class="endface" id="dEndR"></div><span class="hide-sm">Right end</span></div>
        <div class="status" id="dStatus" aria-live="polite">Set your bet and press Play</div>
        <div class="wincard" id="dWinCard" role="status"></div>
      </div>
      <div class="yard">
        <div class="yard-head"><h3>Boneyard</h3><span id="dLeft"></span></div>
        <div class="cells" id="dCells"></div>
      </div>
      <div class="controls">
        <div class="grp">
          <div class="betchips" role="group" aria-label="Bet in credits"><span class="lbl">Bet</span>${BETS.map(b => `<button data-bet="${b}" aria-pressed="${b === bet}">${ICON.coin}${b}</button>`).join('')}</div>
        </div>
        <div class="grp"><button class="btn" id="dMax">Max bet</button><button class="btn gold lg pulse" id="dPlay">Play</button></div>
      </div>
    </div>`;
    track = new Track($('#dBoard'), $('#dTrack'), () => ({ t: 16, r: 54, b: 70, l: 54 }));
    $('#dTab').onclick = () => shelf(true);
    $('#dShelfClose').onclick = () => shelf(false);
    if (!BETS.includes(bet)) bet = BETS[1];
    $$('[data-bet]', el()).forEach(b => b.onclick = () => { if (inRound) return; bet = +b.dataset.bet; store.set('bet', bet); sfx.click(); meters(); status(`Bet ${bet} credits. Press Play`); });
    $('#dMax').onclick = () => { if (inRound) return; bet = BETS[BETS.length - 1]; store.set('bet', bet); meters(); start(); };
    $('#dPlay').onclick = () => {
      if (!inRound) return start();
      if (busy) return;
      const d = downs(); if (d.length) pick(d[rand(d.length)]);
    };
    $('#dWinCard').onclick = () => $('#dWinCard').classList.remove('show');
    idleYard(); paintEnds(); markTier(0); meters();
    requestAnimationFrame(() => { sizeYard(); track.layout(); });
  }
  function shelf(on) { $('#dShelf').classList.toggle('open', on); $('#dTab').setAttribute('aria-expanded', on); if (on) sfx.click(); }
  function status(t) { const s = $('#dStatus'); if (s) s.textContent = t; }
  function meters() {
    if (!$('#dCredits')) return;
    $('#dCredits').textContent = fmt(credits());
    $('#dBetStat').textContent = fmt(bet);
    $('#dWin').textContent = fmt(lastWin);
    $('#dMax').disabled = inRound;
    $$('[data-bet]', el()).forEach(b => { b.disabled = inRound; b.setAttribute('aria-pressed', +b.dataset.bet === bet); });
    $('#dPlay').classList.toggle('pulse', !inRound);
    $('#dPlay').textContent = inRound ? 'Pick for me' : 'Play';
    $$('#dMisses span').forEach((s, i) => s.classList.toggle('on', i < misses));
    $('#dStreakN').textContent = streak; $('#dStreak').classList.toggle('hot', streak >= 3);
    $('#dHotN').textContent = winStreak; $('#dHot').classList.toggle('hot', winStreak >= 2);
    updateWallet();
  }
  function markTier(n) {
    const i = tierOf(n);
    $$('#dPT .prow').forEach(r => { const t = +r.dataset.n; const k = cfg.pay.findIndex(p => p[0] === t); r.classList.toggle('hit', k <= i); r.classList.toggle('top', k === i); r.classList.toggle('next', k === i + 1 && n > 0); });
    const nxt = cfg.pay[i + 1];
    $('#dTier').textContent = i >= 0 ? cfg.pay[i][1] + '×' : (nxt ? nxt[0] : '');
    $('#dTier').title = i >= 0 ? `Paying ${cfg.pay[i][1]}×` : `Pays from ${cfg.pay[0][0]} tiles`;
  }
  function paintEnds(bump) {
    const [L, R] = track && track.items.length ? track.ends() : [null, null];
    const f = (id, v) => { const e = $(id); e.innerHTML = half(v, 'h'); e.classList.toggle('wild', v === 'W'); };
    f('#dEndL', L); f('#dEndR', R);
    if (bump) { const e = $(bump === 'L' ? '#dEndL' : '#dEndR'); e.classList.add('bump'); setTimeout(() => e.classList.remove('bump'), 250); }
  }
  /* boneyard */
  function sizeYard() {
    const host = $('#dCells'); if (!host) return;
    const N = host.children.length || (cfg.max === 6 ? 30 : 58);
    const W = host.clientWidth || host.parentElement.clientWidth - 28;
    const maxH = Math.max(90, Math.min(appH() * (appW() < 760 ? .26 : .24), 300));
    const gap = W < 500 ? 5 : 8;
    let best = { t: 0, cols: N };
    for (let rows = 1; rows <= 8; rows++) {
      const cols = Math.ceil(N / rows);
      const tW = ((W - gap * (cols - 1)) / cols) * 2, tH = (maxH - gap * (rows - 1)) / rows;
      const t = Math.min(tW, tH, 110);
      if (t > best.t) best = { t, cols };
    }
    host.style.setProperty('--gap', gap + 'px');
    host.style.gridTemplateColumns = `repeat(${best.cols}, auto)`;
    $$('.cell', host).forEach(c => c.style.setProperty('--t', Math.floor(best.t)));
  }
  function cellHTML(t, i) {
    return `<div class="slot"></div><div class="card3">${backHTML('v', 'inherit')}${t ? tileHTML(t.a, t.b, 'v', 'inherit', 'face') : '<div class="tile v face" style="--t:inherit"></div>'}</div>`;
  }
  function idleYard() {
    const host = $('#dCells');
    const N = cfg.max === 6 ? 28 + cfg.wilds : 55 + cfg.wilds;
    host.innerHTML = '';
    yard = [];
    for (let i = 0; i < N; i++) {
      const b = document.createElement('button'); b.className = 'cell'; b.setAttribute('aria-label', 'Face-down tile');
      b.innerHTML = cellHTML(null, i); b.onclick = () => { if (!inRound) { status('Press Play to deal a fresh boneyard'); sfx.click(); } };
      host.appendChild(b);
    }
    $('#dLeft').textContent = `${N} tiles`;
  }
  function buildYard() {
    const deck = makeSet(cfg.max).map(t => ({ ...t, wild: false }));
    for (let i = 0; i < cfg.wilds; i++) deck.push({ a: 'W', b: 'W', wild: true });
    shuffle(deck);
    const host = $('#dCells'); host.innerHTML = '';
    yard = deck.map((t, i) => {
      const b = document.createElement('button'); b.className = 'cell';
      b.setAttribute('aria-label', `Boneyard tile ${i + 1}`);
      b.innerHTML = cellHTML(t, i);
      b.onclick = () => pick(i);
      host.appendChild(b);
      return { ...t, state: 'down', el: b };
    });
    sizeYard();
  }
  const downs = () => yard.map((t, i) => t.state === 'down' ? i : -1).filter(i => i >= 0);
  const live = (v) => yard.filter(t => t.state === 'down' && (t.wild || t.a === v || t.b === v)).length;
  function leftCount() { $('#dLeft').textContent = `${downs().length} face down`; }

  function attach(t) {
    const [L, R] = track.ends();
    if (t.wild) {
      if (R !== 'W') return { side: 'R', a: R, b: 'W' };
      if (L !== 'W') return { side: 'L', a: 'W', b: L };
      return { side: 'R', a: R, b: 'W' };
    }
    const other = (v) => (t.a === v ? t.b : t.a), opts = [];
    if (L !== 'W' && (t.a === L || t.b === L)) opts.push({ side: 'L', outer: other(L), a: other(L), b: L });
    if (R !== 'W' && (t.a === R || t.b === R)) opts.push({ side: 'R', outer: other(R), a: R, b: other(R) });
    if (opts.length) { opts.sort((p, q) => live(q.outer) - live(p.outer)); return opts[0]; }
    const outer = live(t.a) >= live(t.b) ? t.a : t.b, inner = outer === t.a ? t.b : t.a;
    if (R === 'W') return { side: 'R', a: 'W', b: outer };
    if (L === 'W') return { side: 'L', a: outer, b: 'W' };
    return null;
  }

  async function start() {
    const tk = session;
    if (inRound || busy) return;
    if (S.credits < bet) { S.credits += START_CREDITS; saveCredits(); toast($('#dToasts'), `Free top-up · +${fmt(START_CREDITS)} credits`, 'mint', '+'); }
    busy = true; inRound = true;
    S.credits -= bet; saveCredits();
    misses = 0; streak = 0; wildsInTrain = 0; bonuses = []; tierIdx = -1;
    $('#dWinCard').classList.remove('show'); shelf(false);
    track.clear(); buildYard(); markTier(0); meters(); paintEnds();
    status('Dealing your starter…');
    tone(330, .08, 'triangle', .04);
    await sleep(300); if (tk !== session) return;
    const cand = downs().filter(i => !yard[i].wild && yard[i].a !== yard[i].b);
    const s = cand[rand(cand.length)], c = yard[s];
    c.el.classList.add('up'); sfx.flip();
    await sleep(380); if (tk !== session) return;
    const from = c.el.getBoundingClientRect();
    c.state = 'used'; c.el.disabled = true; c.el.classList.add('gone');
    const it = track.add(c.a, c.b, 'R');
    fly(from, it);
    paintEnds(); leftCount(); markTier(1);
    await sleep(420); if (tk !== session) return;
    busy = false;
    status(`Match a ${c.a} or a ${c.b}. Tap a tile.`);
    Avatar.say('start');
  }

  async function pick(i) {
    const tk = session;
    if (!inRound) { status('Press Play to start a train'); return; }
    const c = yard[i];
    if (busy || !c || c.state !== 'down') return;
    busy = true;
    c.el.classList.add('up'); sfx.flip();
    await sleep(380); if (tk !== session) return;
    const res = attach(c);
    if (res) {
      const from = c.el.getBoundingClientRect();
      c.state = 'used'; c.el.disabled = true; c.el.classList.add('gone');
      const it = track.add(res.a, res.b, res.side);
      fly(from, it);
      paintEnds(res.side);
      const n = track.items.length;
      streak++; sfx.hit(n); bump('bestStreak', streak, 'max'); bump('bestTrain', n, 'max');
      if (streak === 3 || streak === 5 || streak === 8) Avatar.say('streak');
      const tt = $('#dToasts');
      if (c.wild) { wildsInTrain++; toast(tt, 'Wild tile! That end now takes anything', 'sky', '★');
        if (wildsInTrain === 2) { bonuses.push(['Wild pair', WILD_PAIR * bet]); toast(tt, `Wild pair · +${WILD_PAIR * bet} credits`, 'mint', '+'); } }
      for (const [k, m] of cfg.streak) if (streak === k) { bonuses.push([`Streak of ${k}`, m * bet]); toast(tt, `${k} in a row · +${m * bet} credits`, 'violet', ICON.flame.replace('<svg', '<svg width="14" height="14"')); sfx.tier(); }
      const ti = tierOf(n);
      if (ti > tierIdx) { tierIdx = ti; const p = cfg.pay[ti][1] * bet; toast(tt, `${n} tiles · train pays ${p} credit${p === 1 ? '' : 's'}`, '', n); sfx.tier(); }
      markTier(n); meters(); leftCount();
      const nxt = cfg.pay.find(([t]) => t > n);
      status(nxt ? `${n} tiles · next pay at ${nxt[0]}` : `${n} tiles · top of the paytable`);
      await sleep(460); if (tk !== session) return;
      if (!downs().length) return end();
      busy = false;
    } else {
      c.state = 'miss'; c.el.disabled = true; c.el.classList.add('miss', 'shake');
      misses++; streak = 0; sfx.miss(); meters(); leftCount(); Avatar.say('miss');
      const left = cfg.misses - misses;
      status(left > 0 ? `Miss. ${left} ${left === 1 ? 'chance' : 'chances'} left` : 'Third miss. End of the line');
      await sleep(left > 0 ? 420 : 800); if (tk !== session) return;
      if (left <= 0 || !downs().length) return end();
      busy = false;
    }
  }

  async function end() {
    const tk = session;
    busy = true;
    yard.forEach(t => { if (t.state === 'down') { t.el.classList.add('up', 'dim'); t.el.disabled = true; } });
    const n = track.items.length, trainPay = payFor(n) * bet;
    bump('trains', 1);
    if (trainPay > 0) {
      winStreak++; bump('wins', 1); bump('hotBest', winStreak, 'max');
      for (const [k, m] of HOT) if (winStreak === k) { bonuses.push([`Hot hand ×${k}`, m * bet]); toast($('#dToasts'), `Hot hand · ${k} paying trains in a row`, 'pink', ICON.flame.replace('<svg', '<svg width="14" height="14"')); }
    } else winStreak = 0;
    const bonusTotal = bonuses.reduce((s, b) => s + b[1], 0), total = trainPay + bonusTotal;
    lastWin = total;
    if (total > 0) {
      const card = $('#dWinCard');
      card.innerHTML = `<div class="k">${trainPay > 0 ? 'Winner' : 'Bonus'}</div><div class="amt num" id="dAmt">0</div>
        <div class="sub">credits on a ${fmt(bet)}-credit bet</div>
        <ul>${trainPay > 0 ? `<li><span>${n}-tile train · ${payFor(n)}× bet</span><span>+${trainPay}</span></li>` : `<li><span>${n}-tile train</span><span>0</span></li>`}
        ${bonuses.map(([l, v]) => `<li><span>${l}</span><span>+${v}</span></li>`).join('')}</ul>`;
      card.classList.add('show'); sfx.win(); Avatar.say(payFor(n) >= 8 ? 'big' : 'win');
      const steps = Math.min(total, 30);
      for (let k = 1; k <= steps; k++) { $('#dAmt').textContent = fmt(total * k / steps); sfx.tick(); await sleep(Math.max(16, 700 / steps)); if (tk !== session) return; }
      S.credits += total; saveCredits();
      status(`${n}-tile train pays ${total} credits. Press Play to ride again`);
      setTimeout(() => card.classList.remove('show'), 4200);
    } else {
      const first = cfg.pay[0][0];
      status(`${n}-tile train. Trains pay from ${first} tiles. Press Play`);
    }
    inRound = false; busy = false; misses = misses; meters();
  }
  window.addEventListener('resize', () => { if (current === 'domi' && track) { sizeYard(); track.layout(); } });
  return { open, busy: () => current === 'domi' && busy };
})();

/* =========================================================
   Collections: characters, backs, music, sound packs
   ========================================================= */
const Collection = (() => {
  let kind = 'backs', filter = 'all', focus = null, previewing = null;
  const FILTERS = [['all', 'All'], ['owned', 'Owned'], ['earn', 'Earn'], ['shop', 'Shop']];
  const tierBadge = (b) => b.tier === 'earn' ? '<span class="badge tier-earn">Earn only · exclusive</span>'
    : b.tier === 'buy' ? '<span class="badge tier-buy">Shop only · exclusive</span>'
    : b.tier === 'either' ? '<span class="badge tier-either">Earn or buy</span>' : '<span class="badge soon">Free</span>';
  const isSound = () => kind === 'music' || kind === 'sfx';
  function setKind(k) { if (k !== kind) { filter = 'all'; focus = null; } kind = k; }
  const title = () => isSound() ? 'Music & Sounds' : KINDS[kind].title;
  function actions(item, big) {
    const K = KINDS[kind], own = S[K.own].includes(item.id), eq = S[K.eq] === item.id, verb = kind === 'chars' ? 'Select' : 'Equip';
    let act = '';
    if (eq) act = `<span class="state-eq">${ICON.check}${kind === 'chars' ? 'Selected' : 'Equipped'}</span>`;
    else if (own) act = `<button class="btn ${big ? 'gold' : ''} sm" data-equip="${item.id}">${verb}</button>`;
    else {
      if (item.goal) { const p = progressOf(item); act += `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${item.goal.n}" aria-valuenow="${p}"><div style="width:${p / item.goal.n * 100}%"></div></div><small class="goal">${item.goal.label} · ${p}/${item.goal.n}</small>`; }
      if (item.price) act += `<button class="btn gold sm" data-buy="${item.id}">${ICON.bag}${item.price}</button>`;
    }
    if (K.preview) act += `<button class="btn ghost sm" data-preview="${item.id}">${previewing === item.id ? '■ Stop' : '▶ Preview'}</button>`;
    return act;
  }
  function card(item) {
    const K = KINDS[kind], own = S[K.own].includes(item.id), eq = S[K.eq] === item.id;
    return `<article class="bcard ${own ? '' : 'locked'} ${eq ? 'is-eq' : ''}" style="--rar:${RARITY_COLOR[item.rarity]}">
      <div class="bc-art">${K.art(item, kind === 'backs' ? 124 : 80)}${own ? '' : `<span class="lockpin" aria-label="Locked">${ICON.lock}</span>`}</div>
      <div class="bc-body"><b>${item.name}</b><div class="meta"><span class="badge rar">${item.rarity}</span>${tierBadge(item)}</div><p>${item.desc}</p><div class="bc-act">${actions(item)}</div></div></article>`;
  }
  function charHero(c) {
    const own = S.ownedChars.includes(c.id);
    return `<section class="char-hero" style="--c:${c.color};--cd:${c.deep};--rar:${RARITY_COLOR[c.rarity]}">
      <div class="ch-art">${charArt(c, 190, 'big')}${own ? '' : `<span class="lockpin big" aria-label="Locked">${ICON.lock}</span>`}</div>
      <div class="ch-copy">
        <div class="eyebrow2">${c.title}</div><h2>${c.name}</h2>
        <div class="meta"><span class="badge rar">${c.rarity}</span>${tierBadge(c)}</div>
        <p class="quote">“${c.quote}”</p>
        <p>${c.desc}</p>
        <p class="move"><b>Signature move</b> ${c.move}</p>
        <div class="bc-act row-act">${actions(c, true)}</div>
      </div></section>`;
  }
  function hero() {
    const K = KINDS[kind], eq = K.items.find(x => x.id === S[K.eq]);
    if (kind === 'chars') return charHero(focus || eq);

      || (filter === 'earn' && (b.tier === 'earn' || b.tier === 'either')) || (filter === 'shop' && (b.tier === 'buy' || b.tier === 'either')));

    const grid = kind === 'chars'
      ? `<div class="roster">${list.map(c => { const own = S.ownedChars.includes(c.id); return `<button class="rtile ${own ? '' : 'locked'} ${(focus || CHARS.find(x => x.id === S.char)).id === c.id ? 'focus' : ''} ${S.char === c.id ? 'is-eq' : ''}" data-focus="${c.id}" style="--c:${c.color};--cd:${c.deep};--rar:${RARITY_COLOR[c.rarity]}" aria-label="${c.name}${own ? '' : ', locked'}">${charArt(c, 96)}<span class="rname">${c.name.replace(/ “.*”/, '')}</span>${own ? '' : `<span class="lockpin">${ICON.lock}</span>`}<span class="rtier t-${c.tier}"></span></button>`; }).join('')}</div>`
      : `<div class="back-grid">${list.map(card).join('') || '<p class="note">Nothing here yet. Keep playing to earn your first exclusive.</p>'}</div>`;
    el.innerHTML = `<div class="backs-inner">${soundTabs}${hero()}
      <div class="seg filters" role="group" aria-label="Filter">${FILTERS.map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}</div>
      ${grid}</div>`;
    $$('[data-kind]', el).forEach(b => b.onclick = () => { setKind(b.dataset.kind); sfx.click(); render(); });
    $$('[data-f]', el).forEach(b => b.onclick = () => { filter = b.dataset.f; sfx.click(); render(); });
    $$('[data-focus]', el).forEach(b => b.onclick = () => { focus = CHARS.find(c => c.id === b.dataset.focus); sfx.click(); render(); el.scrollTop = 0; });
    $$('[data-equip]', el).forEach(b => b.onclick = () => { equip(kind, b.dataset.equip); });
    $$('[data-buy]', el).forEach(b => b.onclick = () => buy(b.dataset.buy));
    $$('[data-preview]', el).forEach(b => b.onclick = () => preview(b.dataset.preview));
    if ($('#cMusicToggle')) $('#cMusicToggle').onclick = () => { setMusic(!S.music); render(); };
  }
  function preview(id) {
    if (kind === 'sfx') {
      const prev = S.sfxPack; S.sfxPack = id; AudioFiles.preloadPack(id);
      sfx.flip(); setTimeout(() => sfx.place(), 160); setTimeout(() => sfx.hit(6), 420); setTimeout(() => sfx.win(), 800);
      setTimeout(() => { S.sfxPack = prev; }, 1700);

    else { previewing = id; Music.preview(id, () => { previewing = null; if (current === 'collect') render(); }); }
    render();
  }
  function buy(id) {
    const K = KINDS[kind], b = K.items.find(x => x.id === id);
    sheet('Get ' + b.name, `<div class="buy">
      <div class="buy-art">${K.art(b, kind === 'backs' ? 170 : 150)}</div>
      <div class="buy-copy"><div class="meta"><span class="badge rar" style="--rar:${RARITY_COLOR[b.rarity]}">${b.rarity}</span>${tierBadge(b)}</div>
        <p>${b.desc}</p>
        ${b.tier === 'either' ? `<p class="note">You can also earn it: ${b.goal.label.toLowerCase()} (${progressOf(b)}/${b.goal.n}).</p>` : ''}
        <div class="buy-price">${b.price}</div>
        <p class="note">Prototype only. No payment is taken. In the app, this purchase would go through the App Store or Google Play.</p>
        <div class="row"><button class="btn gold" id="buyOk">${ICON.bag}Buy for ${b.price} (demo)</button><button class="btn ghost" id="buyNo">Not now</button></div></div></div>`);
    $('#buyNo').onclick = () => { $('#sheetHost').innerHTML = ''; };
    $('#buyOk').onclick = () => {
      if (!S[K.own].includes(b.id)) { S[K.own].push(b.id); store.set(K.own, S[K.own]); }
      $('#sheetHost').innerHTML = ''; sfx.win(); equip(kind, b.id);
    };
  }
  return { render, setKind, title };
})();
