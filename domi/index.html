/* =========================================================
   Line games: Draw, Block, All Fives, Fives & Threes
   ========================================================= */
const LineGame = (() => {
  let id, set, cfg, hands, stock, track, scores, turn, passes, over, leader, firstHand, token = 0, pending = null;
  const el = () => $('#table');
  const NAMES = ['You', 'Computer'];

  function open(gid, s) {
    id = gid; set = s; cfg = LINE_CFG[gid]; scores = [0, 0]; firstHand = true; leader = null; token++;
    el().innerHTML = `<div class="game">
      ${hudPanel([
        ['You', '<b id="lYou">0</b>', 'gold'], ['Computer', '<b id="lCpu">0</b>', ''], ['Target', `<b>${cfg.target}</b>`, ''],
        cfg.draw ? ['Boneyard', '<b id="lStock">0</b>', ''] : ['Set', `<b>${set} · ${set}</b>`, ''],
        ['Turn', '<b class="turnval"><span class="dot"></span><span id="lTurnT">Your turn</span></b>', 'span2', 'lTurn'],
      ])}
      <div class="board" id="lBoard">
        <div class="opp"><span class="who">Computer</span><div class="mini" id="lOpp"></div></div>
        <div class="track" id="lTrack"></div>
        <div class="toasts" id="lToasts" aria-live="polite"></div>
        <div class="status" id="lStatus" aria-live="polite"></div>
        <div id="lResult"></div>
      </div>
      <div class="hand-wrap">
        <div class="hand-head"><h3>Your tiles</h3><span class="chip num" id="lPips"></span>
          ${cfg.draw ? '<button class="btn mint sm" id="lDraw" disabled>Draw</button>' : ''}<button class="btn sm" id="lPass" hidden>Pass</button></div>
        <div class="chooser" id="lChooser" hidden></div>
        <div class="hand" id="lHand"></div>
      </div>
    </div>`;
    track = new Track($('#lBoard'), $('#lTrack'), () => ({ t: 52, r: 16, b: 56, l: 16 }));
    if ($('#lDraw')) $('#lDraw').onclick = playerDraw;
    $('#lPass').onclick = () => { $('#lPass').hidden = true; doPass(0); };
    deal();
  }
  function stop() { token++; }
  const status = (t) => { const s = $('#lStatus'); if (s) s.textContent = t; };
  function deal() {
    const deck = shuffle(makeSet(set));
    const n = handSize(set);
    hands = [deck.splice(0, n), deck.splice(0, n)];
    stock = cfg.draw ? deck : [];
    track.clear(); passes = 0; over = false; pending = null;
    $('#lResult').innerHTML = '';
    render();
    requestAnimationFrame(() => begin(token));
  }
  async function begin(tk) {
    await sleep(350); if (tk !== token) return;
    if (firstHand || leader === null) {
      // Highest double leads; if nobody holds a double, the heaviest tile leads.
      let best = null;
      hands.forEach((h, p) => h.forEach((t, i) => {
        const score = (isDouble(t) ? 100 : 0) + t.a + t.b;
        if (!best || score > best.score) best = { p, i, score };
      }));
      const t = hands[best.p][best.i];
      toast($('#lToasts'), `${NAMES[best.p]} ${best.p === 0 ? 'lead' : 'leads'} with ${t.a}-${t.b}`, '', '▶');
      await place(best.p, best.i, 'R');
      if (tk !== token) return;
      firstHand = false;
      return next(1 - best.p, tk);
    }
    turn = leader;
    if (turn === 0) playerTurn(); else cpuTurn(tk);
  }
  function render() {
    $('#lYou').textContent = scores[0]; $('#lCpu').textContent = scores[1];
    if ($('#lStock')) $('#lStock').textContent = stock.length;
    $('#lOpp').innerHTML = hands[1].map(() => backHTML('v', 34)).join('');
    $('#lPips').textContent = `${pipSum(hands[0])} pips`;
    const moves = turn === 0 && !over ? legal(0) : [];
    const t = appW() < 760 ? 68 : 80;
    $('#lHand').innerHTML = hands[0].map((tile, i) => {
      const ok = moves.some(m => m.i === i);
      return `<button class="pick ${turn === 0 && !over ? (ok ? 'ok' : 'no') : ''} ${pending && pending.i === i ? 'sel' : ''}" data-i="${i}" aria-label="Tile ${tile.a}-${tile.b}${ok ? ', playable' : ''}">${tileHTML(tile.a, tile.b, 'v', t)}</button>`;
    }).join('');
    $$('#lHand .pick').forEach(b => b.onclick = () => choose(+b.dataset.i));
    $('#lTurnT').textContent = over ? 'Hand over' : turn === 0 ? 'Your turn' : 'Computer’s turn';
  }
  function legal(p) {
    const res = [];
    if (!track.items.length) return hands[p].map((t, i) => ({ i, side: 'R' }));
    const [L, R] = track.ends();
    hands[p].forEach((t, i) => {
      if (t.a === L || t.b === L) res.push({ i, side: 'L' });
      if ((t.a === R || t.b === R) && !(L === R && res.some(m => m.i === i))) res.push({ i, side: 'R' });
    });
    return res;
  }
  function endsSumAfter(t, side) {
    const items = track.items.map(x => ({ a: x.a, b: x.b }));
    if (!items.length) return t.a + t.b;
    const [L, R] = [items[0].a, items[items.length - 1].b];
    if (side === 'L') { const o = t.a === L ? t.b : t.a; items.unshift({ a: o, b: L }); }
    else { const o = t.a === R ? t.b : t.a; items.push({ a: R, b: o }); }
    if (items.length === 1) return items[0].a + items[0].b;
    const f = items[0], l = items[items.length - 1];
    return (isDouble(f) ? f.a * 2 : f.a) + (isDouble(l) ? l.b * 2 : l.b);
  }
  function playScore(sum) {
    if (cfg.scoring === 'fives') return sum > 0 && sum % 5 === 0 ? sum : 0;
    if (cfg.scoring === 'f3') { let p = 0; if (sum > 0 && sum % 5 === 0) p += sum / 5; if (sum > 0 && sum % 3 === 0) p += sum / 3; return p; }
    return 0;
  }
  async function place(p, i, side) {
    const t = hands[p][i];
    let from;
    if (p === 0) { const b = $(`#lHand .pick[data-i="${i}"]`); from = b ? b.getBoundingClientRect() : null; }
    else { const m = $('#lOpp').children[i] || $('#lOpp'); from = m.getBoundingClientRect(); }
    const pts = playScore(endsSumAfter(t, side));
    hands[p].splice(i, 1);
    let a, b;
    if (!track.items.length) { a = t.a; b = t.b; }
    else if (side === 'L') { const L = track.ends()[0]; a = t.a === L ? t.b : t.a; b = L; }
    else { const R = track.ends()[1]; a = R; b = t.a === R ? t.b : t.a; }
    const it = track.add(a, b, track.items.length ? side : 'R');
    sfx.place();
    if (from) fly(from, it);
    passes = 0;
    if (pts) { scores[p] += pts; toast($('#lToasts'), `${NAMES[p]} ${p === 0 ? 'score' : 'scores'} ${pts}`, p === 0 ? 'mint' : '', '+'); if (p === 0) sfx.tier(); }
    render();
    await sleep(480);
  }
  async function next(p, tk) {
    if (tk !== token) return;
    if (scores.some(s => s >= cfg.target)) return finishMatch();
    if (!hands[1 - p].length) return endHand(1 - p, false);
    if (passes >= 2) return endHand(null, true);
    turn = p; render();
    if (p === 0) playerTurn(); else cpuTurn(tk);
  }
  function playerTurn() {
    pending = null; $('#lChooser').hidden = true;
    const moves = legal(0);
    if ($('#lDraw')) $('#lDraw').disabled = true;
    if (moves.length) { status(track.items.length ? `Your turn · match a ${track.ends()[0]} or a ${track.ends()[1]}` : 'Your lead · play any tile'); render(); return; }
    if (cfg.draw && stock.length) { $('#lDraw').disabled = false; status('No match. Draw a tile.'); render(); return; }
    status('No match and nothing to draw. Pass.'); $('#lPass').hidden = false; render();
  }
  async function playerDraw() {
    if (turn !== 0 || !stock.length) return;
    const t = stock.pop(); hands[0].push(t); sfx.flip();
    toast($('#lToasts'), `You drew ${t.a}-${t.b}`, '', '+', 1600);
    render(); playerTurn();
  }
  function choose(i) {
    if (turn !== 0 || over) return;
    const ms = legal(0).filter(m => m.i === i);
    if (!ms.length) { status('That tile doesn’t match an open end'); return; }
    const t = hands[0][i];
    const sides = [...new Set(ms.map(m => m.side))];
    if (sides.length === 1) return commit(i, sides[0]);
    pending = { i }; render();
    const [L, R] = track.ends();
    const lab = (side) => { const pts = playScore(endsSumAfter(t, side)); return pts ? ` · scores ${pts}` : ''; };
    const ch = $('#lChooser'); ch.hidden = false;
    ch.innerHTML = `<button class="btn sm" data-side="L">◀ Left end (${L})${lab('L')}</button><button class="btn sm" data-side="R">Right end (${R})${lab('R')} ▶</button><button class="btn ghost sm" data-side="X">Cancel</button>`;
    $$('#lChooser button').forEach(b => b.onclick = () => { ch.hidden = true; if (b.dataset.side === 'X') { pending = null; render(); return; } commit(i, b.dataset.side); });
  }
  async function commit(i, side) {
    const tk = token;
    turn = -1; pending = null; $('#lChooser').hidden = true; if ($('#lDraw')) $('#lDraw').disabled = true;
    await place(0, i, side);
    next(1, tk);
  }
  async function doPass(p) {
    passes++;
    toast($('#lToasts'), `${NAMES[p]} ${p === 0 ? 'pass' : 'passes'}`, 'ember', '–', 1600);
    await sleep(500);
    next(1 - p, token);
  }
  async function cpuTurn(tk) {
    status('Computer is thinking…'); render();
    await sleep(650); if (tk !== token) return;
    let moves = legal(1);
    while (!moves.length && cfg.draw && stock.length) {
      hands[1].push(stock.pop()); sfx.flip(); render();
      toast($('#lToasts'), 'Computer draws', '', '+', 1200);
      await sleep(380); if (tk !== token) return;
      moves = legal(1);
    }
    if (!moves.length) return doPass(1);
    // Prefer scoring plays, then shed heavy tiles; keep doubles flexible.
    let best = null;
    for (const m of moves) {
      const t = hands[1][m.i];
      const v = playScore(endsSumAfter(t, m.side)) * 10 + t.a + t.b + (isDouble(t) ? 3 : 0) + Math.random();
      if (!best || v > best.v) best = { ...m, v };
    }
    await place(1, best.i, best.side);
    next(0, tk);
  }
  function endHand(winner, blocked) {
    over = true; turn = -1;
    const pips = [pipSum(hands[0]), pipSum(hands[1])];
    let w = winner, pts = 0;
    if (blocked) { w = pips[0] < pips[1] ? 0 : pips[1] < pips[0] ? 1 : null; }
    if (w !== null) {
      const opp = pips[1 - w];
      if (cfg.scoring === 'pips') pts = opp;
      else if (cfg.scoring === 'fives') pts = Math.round(opp / 5) * 5;
      else pts = 1;
      scores[w] += pts;
      if (w === 0) bump('hands', 1);
      leader = w;
    }
    render();
    if (w === 0) sfx.win();
    const matchOver = scores.some(s => s >= cfg.target);
    const title = w === null ? 'Blocked · no score' : w === 0 ? (blocked ? 'You win the blocked hand' : 'Domino! You’re out') : (blocked ? 'Computer wins the blocked hand' : 'Computer went out');
    $('#lResult').innerHTML = `<div class="result" role="dialog" aria-label="Hand result">
      <h3>${title}</h3><p>${w === null ? 'Equal pips. The next hand leads as before.' : `${NAMES[w]} ${w === 0 ? 'score' : 'scores'} ${pts}`}</p>
      <table><tr><td>Your pips left</td><td>${pips[0]}</td></tr><tr><td>Computer pips left</td><td>${pips[1]}</td></tr>
      <tr><td>Match score</td><td>${scores[0]} – ${scores[1]}</td></tr></table>
      <div class="row">${matchOver ? '' : '<button class="btn gold" id="lNext">Next hand</button>'}<button class="btn ghost" id="lLobby">Lobby</button></div></div>`;
    status(title);
    if (matchOver) return finishMatch();
    $('#lNext').onclick = () => { sfx.click(); deal(); };
    $('#lLobby').onclick = () => go('lobby');
    $('#lNext').focus();
  }
  function finishMatch() {
    over = true; turn = -1; render();
    const youWin = scores[0] >= scores[1];
    if (youWin) sfx.win();
    $('#lResult').innerHTML = `<div class="result" role="dialog" aria-label="Match result">
      <h3>${youWin ? 'You win the match' : 'Computer wins the match'}</h3><p>Final score ${scores[0]} – ${scores[1]} · played to ${cfg.target}</p>
      <div class="row"><button class="btn gold" id="lAgain">Play again</button><button class="btn ghost" id="lLobby">Lobby</button></div></div>`;
    status('Match over');
    $('#lAgain').onclick = () => { sfx.click(); open(id, set); };
    $('#lLobby').onclick = () => go('lobby');
  }
  window.addEventListener('resize', () => { if (current === 'table' && track) { track.layout(); render(); } });
  return { open, stop };
})();

/* =========================================================
   Trains (Mexican Train)
   ========================================================= */
const Trains = (() => {
  let set, engine, players, mex, stock, turn, openDouble, passStreak, over, token = 0;
  const el = () => $('#trains');
  const NAMES = ['You', 'Ava', 'Max'];
  const dealN = (s) => s === 9 ? 10 : 5;

  function open(s) {
    set = s; token++;
    el().innerHTML = `<div class="game">
      ${hudPanel([
        ['Boneyard', '<b id="tStock">0</b>', ''], ['Your pips', '<b id="tPips">0</b>', 'gold'], ['Set', `<b>${set} · ${set}</b>`, ''],
        ['Turn', '<b class="turnval"><span class="dot"></span><span id="tTurnT">Your turn</span></b>', 'span3', 'tTurn'],
      ])}
      <div class="board" id="tBoard">
        <div class="opp"><span class="who">Engine</span><span id="tEngine"></span><span class="who" id="tOppInfo" style="margin-left:auto"></span></div>
        <div class="trains" id="tRows"></div>
        <div class="toasts" id="tToasts" aria-live="polite"></div>
        <div class="status" id="tStatus" aria-live="polite"></div>
        <div id="tResult"></div>
      </div>
      <div class="hand-wrap">
        <div class="hand-head"><h3>Your tiles</h3><button class="btn mint sm" id="tDraw" disabled>Draw</button></div>
        <div class="chooser" id="tChooser" hidden></div>
        <div class="hand" id="tHand"></div>
      </div>
    </div>`;
    $('#tDraw').onclick = playerDraw;
    deal();
  }
  function stop() { token++; }
  const status = (t) => { const s = $('#tStatus'); if (s) s.textContent = t; };
  function deal() {
    const deck = shuffle(makeSet(set));
    engine = set;
    deck.splice(deck.findIndex(t => t.a === set && t.b === set), 1);
    const n = dealN(set);
    players = NAMES.map((name, i) => ({ name, hand: deck.splice(0, n), train: [], open: false }));
    mex = { name: 'Mexican', train: [], open: true };
    stock = deck; openDouble = null; passStreak = 0; over = false; turn = 0;
    $('#tResult').innerHTML = '';
    $('#tEngine').innerHTML = tileHTML(engine, engine, 'h', 44);
    render(); playerTurn();
  }
  const trains = () => [...players, mex];
  const endOf = (tr) => tr.train.length ? tr.train[tr.train.length - 1].b : engine;
  function targets(p) {
    if (openDouble !== null) return [openDouble];
    const t = [p, 3];
    players.forEach((pl, i) => { if (i !== p && pl.open) t.push(i); });
    return t;
  }
  function legal(p) {
    const res = [];
    players[p].hand.forEach((t, i) => targets(p).forEach(k => { const e = endOf(trains()[k]); if (t.a === e || t.b === e) res.push({ i, k }); }));
    return res;
  }
  function render() {
    $('#tStock').textContent = stock.length;
    $('#tPips').textContent = pipSum(players[0].hand);
    $('#tOppInfo').textContent = players.slice(1).map(p => `${p.name}: ${p.hand.length} tiles`).join(' · ');
    const rows = $('#tRows');
    const W = rows.clientWidth - (appW() < 760 ? 64 : 92) - 40;
    const maxLen = Math.max(4, ...trains().map(t => t.train.length + 1));
    const t = clamp(Math.floor(W / maxLen) - 3, 22, 70);
    const tg = turn === 0 && !over && $('#tChooser').dataset.i !== undefined && $('#tChooser').dataset.i !== '' ? JSON.parse($('#tChooser').dataset.k || '[]') : [];
    rows.innerHTML = trains().map((tr, k) => {
      const lab = k === 3 ? '<b>Mexican</b><small>Shared train</small>' : `<b>${tr.name}${k === 0 ? '' : ''}</b><small>${k === 0 ? 'Your train' : tr.hand.length + ' tiles'}</small>`;
      const mk = tr.open && k !== 3 ? '<span class="mk">● Open</span>' : '';
      const dbl = openDouble === k ? '<span class="mk" style="color:#ff8a6b">Cover the double</span>' : '';
      const line = tr.train.length ? tr.train.map(x => tileHTML(x.a, x.b, 'h', t)).join('') : `<span style="font-size:12px;color:rgba(255,255,255,.6);font-weight:700">Starts on ${engine}</span>`;
      return `<div class="trow ${k === 3 ? 'mex' : ''} ${tg.includes(k) ? 'target' : ''}" data-k="${k}"><div class="lab">${lab}${mk}${dbl}</div><div class="line">${line}</div></div>`;
    }).join('');
    $$('#tRows .trow.target').forEach(r => r.onclick = () => commit(+$('#tChooser').dataset.i, +r.dataset.k));
    const moves = turn === 0 && !over ? legal(0) : [];
    const ht = appW() < 760 ? 64 : 76;
    $('#tHand').innerHTML = players[0].hand.map((x, i) => {
      const ok = moves.some(m => m.i === i);
      return `<button class="pick ${turn === 0 && !over ? (ok ? 'ok' : 'no') : ''}" data-i="${i}" aria-label="Tile ${x.a}-${x.b}">${tileHTML(x.a, x.b, 'v', ht)}</button>`;
    }).join('');
    $$('#tHand .pick').forEach(b => b.onclick = () => choose(+b.dataset.i));
    $('#tTurnT').textContent = over ? 'Round over' : turn === 0 ? 'Your turn' : `${players[turn]?.name}’s turn`;
  }
  function playerTurn() {
    turn = 0; clearChooser();
    const moves = legal(0);
    $('#tDraw').disabled = true;
    if (moves.length) { status(openDouble !== null ? `Cover the double on ${openDouble === 3 ? 'the Mexican train' : trains()[openDouble].name === 'You' ? 'your train' : trains()[openDouble].name + '’s train'}` : 'Your turn · play on your train, the Mexican train or an open train'); render(); return; }
    if (stock.length) { $('#tDraw').disabled = false; status('No play. Draw a tile.'); render(); return; }
    status('No play and the boneyard is empty. You pass.'); render();
    setTimeout(() => passTurn(0, token), 900);
  }
  function clearChooser() { const c = $('#tChooser'); c.hidden = true; c.dataset.i = ''; c.dataset.k = ''; c.innerHTML = ''; }
  async function playerDraw() {
    if (turn !== 0 || !stock.length) return;
    $('#tDraw').disabled = true;
    const t = stock.pop(); players[0].hand.push(t); sfx.flip();
    toast($('#tToasts'), `You drew ${t.a}-${t.b}`, '', '+', 1600);
    const moves = legal(0);
    if (moves.length) { status('You can play the tile you drew'); render(); return; }
    render();
    await sleep(700);
    passTurn(0, token);
  }
  function choose(i) {
    if (turn !== 0 || over) return;
    const ms = legal(0).filter(m => m.i === i);
    if (!ms.length) { status('That tile doesn’t fit any train you can play on'); return; }
    if (ms.length === 1) return commit(i, ms[0].k);
    const c = $('#tChooser'); c.hidden = false; c.dataset.i = i; c.dataset.k = JSON.stringify(ms.map(m => m.k));
    const nm = (k) => k === 3 ? 'Mexican train' : k === 0 ? 'Your train' : `${players[k].name}’s train`;
    c.innerHTML = ms.map(m => `<button class="btn sm" data-k="${m.k}">${nm(m.k)}</button>`).join('') + '<button class="btn ghost sm" data-k="x">Cancel</button>';
    $$('#tChooser button').forEach(b => b.onclick = () => { if (b.dataset.k === 'x') { clearChooser(); render(); return; } commit(i, +b.dataset.k); });
    render();
  }
  function put(p, i, k) {
    const t = players[p].hand.splice(i, 1)[0], tr = trains()[k], e = endOf(tr);
    tr.train.push({ a: e, b: t.a === e ? t.b : t.a });
    if (k === p) players[p].open = false;
    sfx.place(); passStreak = 0;
    if (openDouble === k) openDouble = null;
    if (isDouble(t)) openDouble = k;
    return t;
  }
  async function commit(i, k) {
    const tk = token;
    clearChooser(); turn = -1;
    const t = put(0, i, k); render();
    await sleep(350); if (tk !== token) return;
    if (!players[0].hand.length) return endRound(0);
    if (isDouble(t)) { toast($('#tToasts'), 'Double! Play again to cover it', '', '2'); return playerTurn(); }
    nextTurn(1, tk);
  }
  async function passTurn(p, tk) {
    if (tk !== token) return;
    players[p].open = true; passStreak++;
    toast($('#tToasts'), `${players[p].name} ${p === 0 ? 'pass' : 'passes'} · ${p === 0 ? 'your' : players[p].name + '’s'} train is open`, 'ember', '–', 1800);
    render();
    if (!stock.length && passStreak >= players.length) return endRound(null);
    await sleep(450);
    nextTurn((p + 1) % 3, tk);
  }
  function nextTurn(p, tk) {
    if (tk !== token || over) return;
    turn = p; render();
    if (p === 0) playerTurn(); else cpuTurn(p, tk);
  }
  async function cpuTurn(p, tk) {
    status(`${players[p].name} is thinking…`);
    for (;;) {
      await sleep(650); if (tk !== token) return;
      let moves = legal(p);
      if (!moves.length && stock.length) { players[p].hand.push(stock.pop()); sfx.flip(); toast($('#tToasts'), `${players[p].name} draws`, '', '+', 1200); render(); await sleep(350); if (tk !== token) return; moves = legal(p); }
      if (!moves.length) return passTurn(p, tk);
      // Prefer own train, then heavy tiles, then doubles.
      let best = null;
      for (const m of moves) { const t = players[p].hand[m.i]; const v = (m.k === p ? 8 : 0) + t.a + t.b + (isDouble(t) ? 4 : 0) + Math.random(); if (!best || v > best.v) best = { ...m, v }; }
      const t = put(p, best.i, best.k); render();
      if (!players[p].hand.length) return endRound(p);
      if (!isDouble(t)) return nextTurn((p + 1) % 3, tk);
      toast($('#tToasts'), `${players[p].name} played a double`, '', '2', 1500);
    }
  }
  function endRound(winner) {
    over = true; turn = -1; render();
    const pips = players.map(p => pipSum(p.hand));
    const low = Math.min(...pips), w = winner !== null ? winner : pips.indexOf(low);
    if (w === 0) { sfx.win(); bump('trainsWins', 1); }
    $('#tDraw').disabled = true;
    $('#tResult').innerHTML = `<div class="result" role="dialog" aria-label="Round result">
      <h3>${w === 0 ? 'You win the round' : players[w].name + ' wins the round'}</h3>
      <p>${winner !== null ? `${players[winner].name} played ${winner === 0 ? 'your' : 'their'} last tile.` : 'Blocked. Lowest pips wins.'}</p>
      <table>${players.map((p, i) => `<tr><td>${p.name}</td><td>${pips[i]} pips</td></tr>`).join('')}</table>
      <div class="row"><button class="btn gold" id="tAgain">New round</button><button class="btn ghost" id="tLobby">Lobby</button></div></div>`;
    status('Round over');
    $('#tAgain').onclick = () => { sfx.click(); token++; deal(); };
    $('#tLobby').onclick = () => go('lobby');
    $('#tAgain').focus();
  }
  window.addEventListener('resize', () => { if (current === 'trains' && players) render(); });
  return { open, stop };
})();


/* =========================================================
   Prototype page: phone frame (also used for the Framer embed)
   ========================================================= */
function fitPhone() {
  const main = $('#pageMain'), page = $('#page');
  // Real phones get the game full-bleed; everything else gets the frame, scaled to fit its box.
  // Embed: always show the phone frame, scaled to fit the embed box at every size.
  const m = 8;
  const s = Math.min(1, (main.clientHeight - m * 2) / 868, (main.clientWidth - m * 2) / 414);
  $('#phoneSlot').style.setProperty('--s', Math.max(.3, s).toFixed(4));
}
window.addEventListener('resize', fitPhone);
if (window.ResizeObserver) new ResizeObserver(fitPhone).observe($('#pageMain'));

const notes = $('#protoNotes');
if (notes) notes.innerHTML = `
  <div class="kit-sub">Live mobile prototype</div>
  <h2>Domi, built for one thumb</h2>
  <p>Everything inside the frame is playable. Start in the lobby, pick a set, and play Boneyard Run or a classic table against the computer.</p>
  <ul>
    <li style="--c:var(--gold)">Play with credits: bet 10 to 200 per train, with free top-ups</li>
    <li style="--c:var(--violet)">Upgrade your dominoes with 15 backs. Some are free, some are earned, some are shop-only.</li>
    <li style="--c:var(--mint)">Earn-only backs unlock from wins, long trains, streaks and classic-table victories</li>
    <li style="--c:var(--gold)">Choose from 8 characters who react at the table. Some are earned, some are shop-only.</li>
    <li style="--c:var(--pink)">9 music tracks and 4 sound packs to collect, each with a preview</li>
    <li style="--c:var(--sky)">Six playable games on double-six or double-nine sets, each with its own felt</li>
  </ul>
  <div class="note-roster">${CHARS.map(c => charArt(c, 72)).join('')}</div>`;

/* ---------- Boot ---------- */
go('lobby');
fitPhone();
requestAnimationFrame(fitPhone);
})();
</script>
