<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gem Keno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone frame on desktop (notes beside it), full-bleed on phones, ?embed for Framer.
   Game screen: draw tray / machine (banner + 5 lanes: reel, 5 balls, result) / bet + actions. */
:root {
  --ink: #120a24;
  --ink-2: #1b0f36;
  --panel: #24164a;
  --panel-2: #2f1d5e;
  --lane-top: #3b2585;
  --lane-bot: #1f1342;
  --line: rgba(205, 185, 255, .14);
  --line-2: rgba(205, 185, 255, .26);
  --text: #f5f1ff;
  --muted: #a99cc8;
  --gold: #ffcb5c;
  --gold-deep: #f0a020;
  --on-gold: #3a2200;
  --ruby: #ff3b5c;
  --ruby-deep: #a3102f;
  --pearl: #f3f0f8;
  --mint: #3ddc97;
  --g25: #5fd8f5; --g50: #3ddc97; --g100: #5a8cff; --g250: #b57bff; --g500: #ff6fb5;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --gutter: 16px;
  --ball: 48px;
  --slot: 30px;
  color-scheme: normal;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- Presentation page ---------- */
.page {
  height: 100%; display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse 50% 50% at 12% 20%, rgba(255,59,92,.13), transparent 70%),
    radial-gradient(ellipse 50% 50% at 88% 80%, rgba(90,140,255,.14), transparent 70%),
    radial-gradient(ellipse 40% 40% at 90% 10%, rgba(255,203,92,.08), transparent 70%),
    #0b0618;
}
.page-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--gutter); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ph-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ph-brand b { display: block; font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; color: var(--gold); }
.ph-brand small { display: block; color: var(--muted); font-size: 13px; }
.page-main { flex: 1; min-height: 0; overflow: auto; }
.proto { min-height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 64px; padding: 20px var(--gutter); }
.phone-slot { --s: 1; flex: none; position: relative; width: calc(414px * var(--s)); height: calc(868px * var(--s)); }
.phone {
  position: absolute; left: 0; top: 0; width: 414px; height: 868px; box-sizing: border-box; padding: 12px; border-radius: 62px;
  transform: scale(var(--s)); transform-origin: 0 0;
  background: linear-gradient(150deg, #3d3a4c 0%, #1c1a25 40%, #0f0e16 100%);
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 0 0 6px #0b0a12, 0 0 0 1px #000, 0 50px 90px rgba(0,0,0,.55), 0 0 120px rgba(255,59,92,.10);
}
.glass { width: 390px; height: 844px; border-radius: 50px; overflow: hidden; position: relative; background: var(--ink); isolation: isolate; }
.page.bare .page-head, .page.bare .proto-notes { display: none; }
.page.bare .proto { padding: 0; display: block; height: 100%; min-height: 0; }
.page.bare .phone-slot { width: 100%; height: 100%; }
.page.bare .phone { position: static; width: 100%; height: 100%; padding: 0; border-radius: 0; transform: none; background: none; box-shadow: none; }
.page.bare .glass { width: 100%; height: 100%; border-radius: 0; }
.page.embed { background: transparent; }
.page.embed .page-head, .page.embed .proto-notes { display: none; }
.page.embed .proto { padding: 8px; gap: 0; }
.proto-notes { max-width: 340px; display: grid; gap: 18px; }
.proto-notes h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -.5px; text-wrap: balance; }
.proto-notes p { margin: 0; color: #cfc6e6; }
.proto-notes ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.proto-notes li { display: flex; gap: 10px; align-items: baseline; color: #ddd5f0; }
.proto-notes li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--gold)); transform: translateY(-1px); }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.note-gems { display: flex; gap: 6px; flex-wrap: wrap; }
.note-gems svg { width: 58px; height: 41px; }
@media (max-width: 1000px) { .proto-notes { display: none; } }

/* ---------- App shell ---------- */
.app {
  height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(181,123,255,.18), transparent 70%),
    radial-gradient(ellipse 70% 50% at 100% 100%, rgba(255,59,92,.10), transparent 70%),
    linear-gradient(180deg, var(--ink-2), var(--ink));
}
.topbar {
  flex: none; display: flex; align-items: center; gap: 8px; padding-inline: 14px; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); height: calc(56px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--line); background: rgba(18,10,36,.6); backdrop-filter: blur(10px);
}
.page:not(.bare) .topbar { padding-top: 14px; height: 70px; }
.tb-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-brand svg { width: 30px; height: 30px; flex: none; }
.tb-title { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1; letter-spacing: -.2px; white-space: nowrap; }
.tb-title em { font-style: normal; color: var(--gold); }
.spacer { flex: 1; }
.icon-btn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(255,255,255,.04); padding: 0; }
.icon-btn:hover { background: rgba(255,255,255,.08); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.wallet { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 6px; border-radius: 999px; background: rgba(0,0,0,.3); border: 1px solid var(--line-2); font-weight: 800; font-size: 14px; }
.wallet svg { width: 22px; height: 22px; flex: none; }
.wallet.bump { animation: bump .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes bump { 40% { transform: scale(1.12); } }

.screen { flex: 1; min-height: 0; position: relative; }
#game { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }

/* ---------- Draw tray ---------- */
.tray { flex: none; position: relative; border-radius: 18px; padding: 8px 8px 9px; background: rgba(0,0,0,.28); border: 1px solid var(--line); overflow: hidden; }
.tray-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; padding-inline: 2px; }
.tray-head .eyebrow { font-size: 10px; }
.tray-count { font-family: var(--display); font-weight: 700; font-size: 12px; }
.tray-count span { color: var(--muted); }
.caught-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.caught-pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--ruby); box-shadow: 0 0 8px rgba(255,59,92,.7); }
.caught-pill b { color: var(--text); font-family: var(--display); font-size: 12px; }
.slots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; justify-items: center; }
.slot { width: var(--slot); height: var(--slot); border-radius: 50%; background: rgba(255,255,255,.05); box-shadow: inset 0 2px 4px rgba(0,0,0,.45); position: relative; }
.dball {
  position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: calc(var(--slot) * .38); color: #241640; letter-spacing: -.5px;
  background: radial-gradient(circle at 34% 28%, #fff 0 10%, #f3f0f8 28%, #cfc8e0 68%, #8f87a8 100%);
  box-shadow: inset 0 -2px 4px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.45);
  animation: drop var(--dropMs, 420ms) cubic-bezier(.3,0,.6,1) both;
}
.dball.hit { color: #fff; background: radial-gradient(circle at 34% 28%, #ffd0d8 0 8%, #ff5a75 30%, var(--ruby) 55%, var(--ruby-deep) 100%); box-shadow: inset 0 -2px 4px rgba(0,0,0,.3), 0 0 10px rgba(255,59,92,.65); }
@keyframes drop {
  0% { transform: translateY(calc(var(--fall, 90px) * -1)); }
  62% { transform: translateY(0); }
  78% { transform: translateY(-7px); }
  90% { transform: translateY(0); }
  95% { transform: translateY(-2px); }
  100% { transform: translateY(0); }
}

/* ---------- Machine ---------- */
.machine {
  flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; margin-top: 10px;
  border-radius: 22px; padding: 18px 7px 7px;
  background: linear-gradient(180deg, rgba(255,203,92,.95), rgba(240,160,32,.75) 30%, rgba(150,90,20,.65)) border-box;
  border: 2px solid transparent;
  background-clip: border-box;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
.machine::before { content: ""; position: absolute; inset: 2px; border-radius: 20px; background: linear-gradient(180deg, #23154a, #160c30); }
.banner {
  position: absolute; left: 50%; top: -13px; transform: translateX(-50%); z-index: 3; max-width: 86%;
  height: 26px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  background: #0d0720; border: 1.5px solid var(--gold); box-shadow: 0 4px 12px rgba(0,0,0,.5);
  font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.banner.win { background: linear-gradient(180deg, #ffd977, var(--gold-deep)); color: var(--on-gold); border-color: #fff1c4; animation: bannerPop .6s cubic-bezier(.2,1.5,.4,1); }
@keyframes bannerPop { 0% { transform: translateX(-50%) scale(.7); } 100% { transform: translateX(-50%) scale(1); } }
.lanes { position: relative; z-index: 1; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.lane {
  min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 4px; border-radius: 14px;
  background: linear-gradient(180deg, var(--lane-top), var(--lane-bot));
  box-shadow: inset 0 0 0 1px rgba(255,203,92,.22), inset 0 1px 0 rgba(255,255,255,.08);
  transition: box-shadow .3s;
}
.lane.won { box-shadow: inset 0 0 0 2px var(--gold), 0 0 18px rgba(255,203,92,.35); }

.reel {
  flex: none; height: var(--reelH, 56px); border-radius: 10px; overflow: hidden; position: relative;
  background: linear-gradient(180deg, #d9d2ea 0%, #fdfcff 22%, #fdfcff 78%, #d9d2ea 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), inset 0 3px 6px rgba(0,0,0,.25), inset 0 -3px 6px rgba(0,0,0,.2);
}
.reel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(40,20,80,.28), transparent 26%, transparent 74%, rgba(40,20,80,.28)); }
.strip { display: flex; flex-direction: column; will-change: transform; }
.strip.fast { filter: blur(1.4px); }
.sym { flex: none; display: block; width: 100%; height: var(--reelH, 56px); }
.reel.dim .sym { opacity: .32; filter: grayscale(.7); transition: opacity .3s, filter .3s; }
.reel.lit { box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 14px rgba(255,203,92,.6); }
.reel.lit .sym { animation: symPop .7s cubic-bezier(.2,1.6,.4,1); }
@keyframes symPop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
.reel.landed { animation: settle .28s ease-out; }
@keyframes settle { 40% { transform: translateY(2px); } }

.rail { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; }
.ball {
  width: var(--ball); height: var(--ball); flex: none; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: calc(var(--ball) * .36); letter-spacing: -.5px; color: #241640;
  background: radial-gradient(circle at 34% 28%, #fff 0 10%, #f3f0f8 28%, #cfc8e0 68%, #8f87a8 100%);
  box-shadow: inset 0 -3px 6px rgba(0,0,0,.22), 0 3px 7px rgba(0,0,0,.45);
  transition: transform .12s;
}
.ball:not(:disabled):hover { transform: scale(1.05); }
.ball:disabled { opacity: 1; }
.ball.hit { color: #fff; background: radial-gradient(circle at 34% 28%, #ffd0d8 0 8%, #ff5a75 30%, var(--ruby) 55%, var(--ruby-deep) 100%); box-shadow: inset 0 -3px 6px rgba(0,0,0,.3), 0 0 14px rgba(255,59,92,.7); animation: hitPop .45s cubic-bezier(.2,1.6,.4,1); }
.ball.flip { animation: flip .35s ease-out; }
@keyframes hitPop { 0% { transform: scale(.75); } 100% { transform: scale(1); } }
@keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }

.res { flex: none; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 9px; background: rgba(0,0,0,.35); }
.dots { display: flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.16); transition: background .2s; }
.dots i.on { background: var(--ruby); box-shadow: 0 0 6px rgba(255,59,92,.8); }
.amt { font-family: var(--display); font-weight: 800; font-size: 12px; line-height: 1; color: var(--muted); min-height: 12px; }
.amt.pay { color: var(--gold); }

/* ---------- Controls ---------- */
.controls { flex: none; display: grid; gap: 8px; }
.stats { display: flex; align-items: center; gap: 8px; }
.stat { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
.stat b { font-family: var(--display); font-size: 14px; color: var(--text); letter-spacing: 0; }
.stat.win b { color: var(--gold); }
.chip-btn { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255,255,255,.05); font-size: 12px; font-weight: 800; letter-spacing: .4px; display: inline-flex; align-items: center; gap: 6px; }
.chip-btn svg { width: 15px; height: 15px; }
.chip-btn[aria-pressed="true"] { background: rgba(255,203,92,.16); border-color: var(--gold); color: var(--gold); }
.chip-btn:disabled { opacity: .45; }
.actions { display: grid; grid-template-columns: 1fr auto 1.35fr; gap: 8px; align-items: stretch; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 54px; padding: 0 12px; border-radius: 16px;
  border: 0; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .3px; white-space: nowrap;
  transition: transform .12s, filter .12s, opacity .2s;
}
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { opacity: .45; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-gold { background: linear-gradient(180deg, #ffe08a, var(--gold) 45%, var(--gold-deep)); color: var(--on-gold); box-shadow: 0 5px 0 #a8650c, 0 10px 24px rgba(240,160,32,.35); font-size: 18px; letter-spacing: 1px; }
.btn-gold:active:not(:disabled) { box-shadow: 0 3px 0 #a8650c; }
.btn-ghost { background: rgba(255,255,255,.06); border: 1px solid var(--line-2); font-size: 12px; flex-direction: column; gap: 3px; }
.btn-ghost svg { width: 18px; height: 18px; color: var(--gold); }
.stepper { display: flex; align-items: center; height: 54px; border-radius: 16px; background: rgba(0,0,0,.32); border: 1px solid var(--line-2); }
.stepper button { width: 36px; height: 100%; border: 0; background: none; font-size: 22px; font-weight: 800; color: var(--gold); padding: 0; }
.stepper button:disabled { color: var(--muted); opacity: .4; }
.stepper .val { min-width: 54px; text-align: center; display: grid; line-height: 1.05; }
.stepper .val b { font-family: var(--display); font-size: 18px; }
.stepper .val small { font-size: 9px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }

/* ---------- Sheets, overlays, toasts ---------- */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(6,3,14,.62); backdrop-filter: blur(3px); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 86%; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #2a1a58, #1b0f36); border-radius: 26px 26px 0 0; border-top: 1px solid var(--line-2);
  box-shadow: 0 -20px 50px rgba(0,0,0,.5); animation: up .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes up { from { transform: translateY(100%); } }
.sheet-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
.sheet-head h3 { margin: 0; flex: 1; font-family: var(--display); font-weight: 800; font-size: 18px; }
.sheet-body { overflow-y: auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.sheet-body section { margin-bottom: 18px; }
.sheet-body h4 { margin: 0 0 8px; font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
.sheet-body p { margin: 0 0 8px; color: #ddd5f0; }
.sheet-body ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: #ddd5f0; }
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable td { padding: 9px 10px; border-top: 1px solid var(--line); }
.ptable tr:first-child td { border-top: 0; }
.ptable td:last-child { text-align: right; font-family: var(--display); font-weight: 800; color: var(--gold); }
.ptable .dots i { width: 9px; height: 9px; }
.boxed { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sym-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sym-card { display: grid; justify-items: center; gap: 2px; padding: 6px 2px 8px; border-radius: 12px; background: #f6f3fb; color: #2a1a58; font-size: 10px; font-weight: 800; text-align: center; line-height: 1.15; }
.sym-card svg { width: 100%; height: auto; aspect-ratio: 100 / 70; }
.fine { font-size: 12px; color: var(--muted) !important; }

.picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.pk { aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; font-family: var(--display); font-weight: 700; font-size: 13px; color: #241640; background: radial-gradient(circle at 34% 28%, #fff 0 10%, #ece8f4 40%, #b9b1cf 100%); }
.pk.taken { background: rgba(255,255,255,.08); color: var(--muted); }
.pk.cur { background: radial-gradient(circle at 34% 28%, #fff1c4 0 10%, var(--gold) 45%, var(--gold-deep) 100%); color: var(--on-gold); box-shadow: 0 0 0 3px rgba(255,203,92,.35); }
.picker-tools { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.picker-tools .col-preview { display: flex; gap: 4px; margin-right: auto; }
.picker-tools .col-preview span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 11px; font-weight: 800; color: #241640; background: #e6e1f0; }
.picker-tools .col-preview span.cur { background: var(--gold); color: var(--on-gold); }

.celebrate { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(40,15,80,.9), rgba(6,3,14,.95)); animation: fade .25s; cursor: pointer; }
.cel-card { text-align: center; display: grid; justify-items: center; gap: 6px; animation: celIn .6s cubic-bezier(.2,1.5,.4,1); }
@keyframes celIn { from { transform: scale(.5); opacity: 0; } }
.cel-kicker { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.cel-title { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -1px; background: linear-gradient(180deg, #fff3c9, var(--gold) 50%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #7a3e05) drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
.cel-amt { font-family: var(--display); font-weight: 900; font-size: 34px; color: #fff; }
.cel-gem svg { width: 150px; height: 105px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
.cel-tap { margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 700; }

.toasts { position: absolute; left: 0; right: 0; top: 80px; z-index: 50; display: grid; justify-items: center; gap: 6px; pointer-events: none; }
.toast { padding: 9px 14px; border-radius: 12px; background: #0d0720; border: 1px solid var(--line-2); font-size: 13px; font-weight: 700; box-shadow: 0 8px 20px rgba(0,0,0,.45); animation: fade .2s; }

/* =========================================================

/* Recorded sounds load from sound/<name>.mp3 when the page is served over http(s).
   Any file that is missing or fails to decode falls back to the synthesized version below. */
const SOUND_FILES = { drop: .35, catch: .16, tick: .025, stop: .3, column: .14, win: .22, bigwin: .24, gem: .18 };
const Sound = {
  ctx: null, master: null, _spin: 0, buf: {}, _raw: null,
  prefetch() {

  },
  decode() {
    if (!this._raw || !this.ctx) return;
    const raw = this._raw; this._raw = null;
    for (const n in raw) raw[n].then(a => {
      if (!a) return;
      try { const p = this.ctx.decodeAudioData(a, b => { this.buf[n] = b; }, () => {}); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    });
  },
  sample(n, rate = 1) {

  },
  init() {

  ok() { return S.sound && this.ctx && this.ctx.state === 'running'; },
  tone(f, d, { type = 'sine', g = .2, at = 0, to = null } = {}) {

  },
  drop() { if (this.sample('drop')) return; this.noise(.05, { g: .35, f: 2600 }); this.tone(460, .09, { type: 'triangle', g: .1, to: 210 }); },
  hit() { if (this.sample('catch')) return; this.tone(1175, .3, { g: .1 }); this.tone(1760, .24, { g: .05, at: .03 }); },
  tick() { if (this.sample('tick')) return; this.tone(1900, .018, { type: 'square', g: .018 }); },
  stop() { if (this.sample('stop')) return; this.tone(170, .14, { type: 'triangle', g: .22, to: 85 }); this.noise(.04, { g: .15, f: 900 }); },
  lane(i) { if (this.sample('column', 1 + i * 120 / 660)) return; this.tone(660 + i * 120, .2, { type: 'triangle', g: .12 }); },
  win(big) { if (this.sample(big ? 'bigwin' : 'win')) return; [523, 659, 784, 1047, big ? 1319 : 0, big ? 1568 : 0].forEach((f, k) => f && this.tone(f, .34, { type: 'triangle', g: .13, at: k * .09 })); },
  gem() { if (this.sample('gem')) return; [1568, 2093, 2637, 3136, 2637, 3520].forEach((f, k) => this.tone(f, .45, { g: .06, at: k * .07 })); },
  spinStart() { clearInterval(this._spin); this._spin = setInterval(() => this.tick(), 92); },

const FX = {
  cv: null, cx: null, parts: [], raf: 0, dpr: 1,
  resize() {
    const cv = this.cv = $('#fx'), app = $('#app');
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = app.clientWidth * this.dpr; cv.height = app.clientHeight * this.dpr;
    this.cx = cv.getContext('2d');
  },
  burst(x, y, n, colors, power = 1) {
    if (reduced) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 6) * power;
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3 * power, r: 3 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 1, c: colors[i % colors.length] });
    }

  loop() {

      p.vy += .22; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .012;
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = p.c; cx.beginPath(); cx.moveTo(0, -p.r); cx.lineTo(p.r * .7, 0); cx.lineTo(0, p.r); cx.lineTo(-p.r * .7, 0); cx.closePath(); cx.fill();
      cx.restore();
    }
    this.raf = this.parts.length ? requestAnimationFrame(() => this.loop()) : 0;
    if (!this.raf) { cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); }
  },
};

/* =========================================================
   Round
   ========================================================= */
function timing() {
  if (reduced) return { gap: 70, drop: 1, reelBase: 150, stagger: 90, evalGap: 60 };
  return S.turbo ? { gap: 60, drop: 280, reelBase: 160, stagger: 130, evalGap: 80 } : { gap: 150, drop: 440, reelBase: 380, stagger: 300, evalGap: 170 };
}

    L.el.classList.remove('won'); L.reel.classList.remove('lit', 'dim');

function dropBall(k, n, T, isHit) {
  const slot = $(`.slot[data-k="${k}"]`);

  b.className = 'dball num'; b.textContent = n;

function spinReel(i, target, dur) {
  const L = lanes[i], H = L.reel.clientHeight, st = L.strip;
  L.reel.setAttribute('aria-label', `Reel ${i + 1}: spinning`);
  const finish = () => {
    st.classList.remove('fast'); st.style.transition = 'none'; st.style.transform = 'none'; st.innerHTML = symCell(target);
    L.reel.setAttribute('aria-label', `Reel ${i + 1}: ${symLabel(target)}`);
    L.reel.classList.remove('landed'); void L.reel.offsetWidth; L.reel.classList.add('landed');
    Sound.stop();
  };

  const steps = Math.max(10, Math.round(dur / 70));
  const filler = () => SYMBOLS[Math.random() * SYMBOLS.length | 0];
  const cells = [S.reelSyms[i]];

  st.innerHTML = cells.map(symCell).join('');
  st.style.transition = 'none'; st.style.transform = 'translateY(0)'; void st.offsetHeight;
  st.classList.add('fast');
  st.style.transition = `transform ${dur}ms cubic-bezier(.15,.6,.25,1.03)`;
  st.style.transform = `translateY(${-(cells.length - 2) * H}px)`;
  setTimeout(() => st.classList.remove('fast'), dur * .7);

}

async function play() {
  if (S.busy) return;
  Sound.init();
  if (S.credits < totalBet()) {
    if (S.credits >= BETS[0] * COLS) {
      let i = S.betIdx; while (i > 0 && BETS[i] * COLS > S.credits) i--;
      setBet(i); toast(`Bet lowered to ${bet()} per column`); return;
    }
    return openRefill();
  }
  setBusy(true);
  $('#overlayHost').innerHTML = '';
  const b = bet(), T = timing();
  S.credits -= b * COLS; updateWallet(); save();
  resetBoard();
  $('#lastWin').textContent = '0';
  const drawn = drawNumbers();
  const syms = Array.from({ length: COLS }, () => weightedSymbol());
  const drawTime = DRAWS * T.gap + T.drop;
  banner('Drawing…');
  const spins = syms.map((sym, i) => spinReel(i, sym, drawTime + T.reelBase + i * T.stagger));
  Sound.spinStart();
  const pickSets = S.picks.map(c => new Set(c));
  const live = Array(COLS).fill(0);
  let caught = 0;
  for (let k = 0; k < DRAWS; k++) {
    const n = drawn[k];
    const isHit = pickSets.some(s => s.has(n));
    dropBall(k, n, T, isHit);
    Sound.drop();
    setTimeout(() => {
      $('#drawCount').firstChild.textContent = k + 1;
      if (!isHit) return;
      S.picks.forEach((col, c) => {
        const r = col.indexOf(n); if (r < 0) return;
        lanes[c].balls[r].classList.add('hit');
        lanes[c].dots[live[c]++].classList.add('on');
        caught++;
      });
      $('#caught').textContent = caught;
      Sound.hit();
    }, T.drop * .62);
    await sleep(T.gap);
  }
  await sleep(T.drop);
  banner('Reels…');
  await Promise.all(spins);
  Sound.spinStop();
  S.reelSyms = syms;

  const drawnSet = new Set(drawn);
  let total = 0, topGem = null;
  const app = $('#app'), appBox = app.getBoundingClientRect();
  for (let i = 0; i < COLS; i++) {
    const r = scoreColumn(S.picks[i], drawnSet, syms[i], b), L = lanes[i];
    L.reel.classList.add(r.applied ? 'lit' : 'dim');
    if (r.win > 0) {
      total += r.win;
      L.el.classList.add('won'); L.amt.textContent = '+' + fmt(r.win); L.amt.classList.add('pay');
      Sound.lane(i);
      const rb = L.reel.getBoundingClientRect(), sc = appBox.width / app.clientWidth;
      FX.burst((rb.left + rb.width / 2 - appBox.left) / sc, (rb.top + rb.height / 2 - appBox.top) / sc, r.gemPay ? 26 : 12, r.gemPay ? GEM_COLORS : ['#ffcb5c', '#fff1c4', '#ff3b5c'], .8);
    } else {
      L.amt.textContent = r.catches ? `${r.catches} of 5` : '—';
    }
    if (r.gemPay && (!topGem || syms[i].value > topGem.value)) topGem = syms[i];
    await sleep(T.evalGap);
  }

  S.lastWin = total;
  $('#lastWin').textContent = fmt(total);
  if (total > 0) {
    const from = S.credits; S.credits += total; S.best = Math.max(S.best, total); save();
    const x = total / totalBet();
    banner(x >= 15 ? `Congratulations! +${fmt(total)}` : `You win ${fmt(total)}`, true);
    Sound.win(x >= 15);
    say(`You win ${fmt(total)} credits with ${caught} catches.`);
    const walletAnim = countWallet(from, S.credits, Math.min(1400, 400 + x * 40));
    if (topGem) { Sound.gem(); await celebrate({ kicker: `${topGem.name} gem`, title: 'Gem bonus!', amount: total, gem: topGem }); }
    else if (x >= 50) await celebrate({ kicker: 'Congratulations!', title: 'Mega win', amount: total });
    else if (x >= 15) await celebrate({ kicker: 'Congratulations!', title: 'Big win', amount: total });
    await walletAnim;
  } else {
    banner(caught ? 'No pay this time' : 'No catches this time');
    say(`No win. ${caught} catches.`);
    save();
  }
  setBusy(false);
  if (S.credits < BETS[0] * COLS) setTimeout(openRefill, 600);
}

function sheet(title, body, onMount) {
  const host = $('#sheetHost');
  host.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
    <div class="sheet-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="sheet-body">${body}</div></div>`;

function celebrate({ kicker, title, amount, gem }) {
  return new Promise(res => {

    const amt = $('.cel-amt', host), t0 = performance.now(), dur = 1100;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); amt.textContent = '+' + fmt(amount * (1 - (1 - k) ** 3)); if (k < 1 && host.firstChild) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    const app = $('#app');
    FX.burst(app.clientWidth / 2, app.clientHeight * .42, 70, gem ? GEM_COLORS : ['#ffcb5c', '#fff1c4', '#ff3b5c', '#ffffff'], 1.2);
    let done = false;
    const close = () => { if (done) return; done = true; host.innerHTML = ''; res(); };
    $('.celebrate', host).addEventListener('click', close);
    setTimeout(close, 3200);
  });
}

    <section class="kit-sec"><header><h3>Celebrations</h3><span>Full-screen moments over a violet scrim, with gem-shard confetti</span></header>
      <div class="two-col">
        <div class="kit-panel"><div class="celebrate"><div class="cel-card"><div class="cel-gem"><svg viewBox="0 0 100 70" aria-hidden="true"><use href="#sym-g500"/></svg></div><div class="cel-kicker">Pink heart gem</div><div class="cel-title">Gem bonus!</div><div class="cel-amt num">+3,000</div><div class="cel-tap">Tap to continue</div></div></div></div>
        <div class="kit-panel"><div class="celebrate"><div class="cel-card"><div class="cel-kicker">Congratulations!</div><div class="cel-title">Big win</div><div class="cel-amt num">+450</div><div class="cel-tap">Tap to continue</div></div></div></div>
      </div>
      <p class="note">Gem bonus fires on any gem pay. Big win at 15× the total bet, Mega win at 50×. Each closes on tap or after 3.2 seconds.</p></section>

    <section class="kit-sec"><header><h3>Sound</h3><span>Synthesized in code for the prototype. Swap in recorded sounds with the same names</span></header>
      <div class="tablewrap"><table class="ktable"><thead><tr><th>Sound</th><th>When</th><th>Recipe</th></tr></thead><tbody>
        ${sounds.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section>

    <section class="kit-sec"><header><h3>Motion</h3><span>Physical and quick. Reduced motion skips the bounces, blur and pops</span></header>
      <div class="tablewrap"><table class="ktable"><thead><tr><th>Moment</th><th>Duration</th><th>Easing</th><th>Use</th></tr></thead><tbody>
        ${motion.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><code>${r[2]}</code></td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></section>

    <section class="kit-sec"><header><h3>Icons</h3><span>2 px stroke, round caps, 24 px grid</span></header>
      <div class="icons">${['help', 'sound', 'mute', 'shuffle', 'bolt', 'close'].map(k => `<div>${ICON[k]}<span>${k}</span></div>`).join('')}<div><svg aria-hidden="true"><use href="#coin"/></svg><span>coin</span></div><div><svg aria-hidden="true"><use href="#logo"/></svg><span>logo</span></div></div></section>

    <section class="kit-sec"><header><h3>Shape and spacing</h3><span>Radii step up with element size; spacing on a 4 px base</span></header>
      <div class="two-col">
        <div class="radii">${[[9, 'Result'], [10, 'Reel'], [12, 'Icon btn'], [14, 'Column'], [16, 'Button'], [18, 'Tray'], [22, 'Frame'], [26, 'Sheet']].map(([r, n]) => `<div style="border-radius:${r}px">${r}<br>${n}</div>`).join('')}</div>
        <div class="space">${[4, 5, 8, 10, 12, 16].map(v => `<div><i style="width:${v * 4}px"></i>${v} px</div>`).join('')}</div>
      </div></section>
  </div>`;
}

/* =========================================================
   Presentation page
   ========================================================= */
function renderNotes() {
  $('#protoNotes').innerHTML = `
    <span class="eyebrow">Mobile game prototype</span>
    <h2>Keno on the bottom. Reels on top.</h2>
    <p>A modern rebuild of my original keno-slot concept. Five keno cards sit side by side, each under its own reel.</p>
    <ul>
      <li style="--c:var(--pearl)">Five pick-5 keno cards, numbers 1 to 80</li>
      <li style="--c:var(--ruby)">Twenty balls drop while the reels spin</li>
      <li style="--c:var(--gold)">Reels land 2x to 10x on paying columns</li>
      <li style="--c:var(--g250)">Gems pay 25 to 500 on 4 or 5 catches</li>
    </ul>
    <div class="note-gems" aria-hidden="true">${GEMS.map(s => `<svg viewBox="0 0 100 70"><use href="#sym-${s.id}"/></svg>`).join('')}</div>
    <p class="fine" style="color:var(--muted)">Tap any ball to choose numbers. Space bar drops.</p>`;
}
const page = $('#page');
const params = new URLSearchParams(location.search);
const embed = document.body.classList.contains('embed-body') || params.has('embed') || params.get('mode') === 'embed';
if (embed) { page.classList.add('embed'); document.body.classList.add('embed-body'); }
function layout() {
  const bare = !embed && window.innerWidth <= 560;
  page.classList.toggle('bare', bare);
  if (!bare) {
    const availH = embed ? window.innerHeight - 16 : $('.page-main').clientHeight - 40;
    const availW = window.innerWidth - (embed ? 16 : 32);
    $('#phoneSlot').style.setProperty('--s', Math.min(1, availH / 868, availW / 414).toFixed(4));
  }
  fit(); FX.resize();
}

/* =========================================================
   Boot
   ========================================================= */
buildArt();
if ($('#kit')) renderKit();
else {
  Sound.prefetch();
  renderTopbar();
  renderGame();
  layout();
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe($('#game'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !$('#sheetHost').firstChild && !e.target.closest('button')) { e.preventDefault(); play(); }
  });
}
})();
</script>
</body>
</html>
