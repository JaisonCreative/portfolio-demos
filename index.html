   Card flight, overlays, confetti
   ========================================================= */
function fly(fromEl, toEl, card) {
  return new Promise(res => {
    const app = appEl(), ar = app.getBoundingClientRect(), k = ar.width / app.offsetWidth;
    const f = fromEl.getBoundingClientRect(), t = toEl.getBoundingClientRect();
    const w0 = f.width / k, w1 = t.width / k;
    const el = document.createElement('div');
    el.className = 'flyer';
    el.innerHTML = cardHTML(card, { up: false, w: w0 });
    el.style.left = (f.left - ar.left) / k + 'px'; el.style.top = (f.top - ar.top) / k + 'px';
    app.appendChild(el);
    sfx.deal(2);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = `translate(${(t.left - f.left) / k}px, ${(t.top - f.top) / k}px) scale(${w1 / w0})`;
    }));
    setTimeout(() => { el.remove(); res(); }, S.fast ? 220 : 400);
  });
}
function overlay(html) {
  return new Promise(res => {
    const host = $('#overlayHost');
    host.innerHTML = `<div class="overlay" role="dialog" aria-modal="true">${html}</div>`;
    const done = (v) => { host.innerHTML = ''; res(v); };
    host.querySelectorAll('[data-ok]').forEach(b => { b.onclick = () => { sfx.click(); done(b.dataset.ok); }; });
    host.querySelector('[data-ok]').focus();
  });
}
async function celebrate(title, amt, sub) {

}
let fxParts = [], fxRun = false;
function confetti(n) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#fx'), app = appEl(); cv.width = app.offsetWidth * 2; cv.height = app.offsetHeight * 2;
  const cols = ['#ffc35a', '#ff6f59', '#3ddc97', '#5aa8ff', '#a77bff', '#ff5fb0', '#f6efe0'];
  for (let i = 0; i < n; i++) fxParts.push({ x: cv.width / 2 + (Math.random() - .5) * 160, y: cv.height * .42, vx: (Math.random() - .5) * 26, vy: -Math.random() * 30 - 8, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, s: 8 + Math.random() * 10, c: cols[rand(cols.length)], life: 0 });
  if (fxRun) return; fxRun = true;
  const ctx = cv.getContext('2d');
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    fxParts = fxParts.filter(p => p.y < cv.height + 40 && p.life < 240);
    for (const p of fxParts) { p.vy += .9; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (fxParts.length) requestAnimationFrame(tick); else { fxRun = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  };
  requestAnimationFrame(tick);
}

function kitBoard({ cards, felt = FELTS[0], phase = 'result', marked = [], hint = [], bpl = 5, cw = 64 }) {
  const res = score(cards, bpl);
  const mk = (i, pos) => {
    const k = res.lines[i].k, h = HANDS[k];
    if (phase === 'idle') return `<span class="mk" style="${pos}">${i + 1}</span>`;
    if (!h) return `<span class="mk dead" style="${pos}">${i + 1}</span>`;
    return `<span class="mk has" style="${pos};--rc:var(--r-${k})">${h.short}</span>`;
  };
  const winCells = new Set(); res.lines.forEach(l => { if (l.pay > 0) LINES[l.i].forEach(x => winCells.add(x)); });
  const ch = cw * 1.4, W = cw * 3 + 14, H = ch * 3 + 14;
  const cx = (n) => W * (1 + 2 * (n % 3)) / 6, cy = (n) => H * (1 + 2 * (n / 3 | 0)) / 6;
  const strikes = phase === 'result' ? res.lines.filter(l => l.pay > 0).map(l => {
    const a = LINES[l.i][0], b = LINES[l.i][2]; let x1 = cx(a), y1 = cy(a), x2 = cx(b), y2 = cy(b);
    const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len, e = Math.min(W, H) * .1;
    return `<line x1="${x1 - ux * e}" y1="${y1 - uy * e}" x2="${x2 + ux * e}" y2="${y2 + uy * e}" pathLength="1" stroke="var(--r-${l.k})" style="color:var(--r-${l.k})"/>`;
  }).join('') : '';
  return `<div class="board ${cards[4] && cards[4].w ? 'free' : ''}" style="--cw:${cw}px;${feltVars(felt)}">
    ${mk(6, 'grid-column:1;grid-row:1')}${mk(3, 'grid-column:2;grid-row:1')}${mk(4, 'grid-column:3;grid-row:1')}${mk(5, 'grid-column:4;grid-row:1')}${mk(7, 'grid-column:5;grid-row:1')}
    ${[0, 1, 2].map(r => mk(r, `grid-column:1;grid-row:${r + 2}`)).join('')}
    <div class="well-bed" aria-hidden="true"></div>
    ${cards.map((c, i) => `<div class="cell ${marked.includes(i) ? 'marked' : ''} ${hint.includes(i) ? 'hint' : ''} ${phase === 'result' && !winCells.has(i) ? 'dim' : ''}" style="grid-column:${i % 3 + 2};grid-row:${(i / 3 | 0) + 2}">${phase === 'idle' ? cardHTML(c, { up: false }) : cardHTML(c, { cls: 'static' })}<span class="tag">SWAP</span></div>`).join('')}
    <svg class="strikes" viewBox="0 0 ${W} ${H}" aria-hidden="true">${strikes}</svg>
    <div class="rim-foot"><span>8 lines</span><span>Bet <b>${bpl}</b> × 8</span><span>TIC·A·TAC</span></div>
  </div>`;
}

      <div class="charkit">${CHARS.map(c => `<article class="ck" style="--c:${c.color};--cd:${c.deep};--rar:${RARITY_COLOR[c.rarity]}">
        <div class="ck-head">${charArt(c, 112)}<div><div class="eyebrow2">${c.title}</div><h4>${c.name}</h4><div class="meta"><span class="badge rar">${c.rarity}</span>${tierBadge(c)}${c.price ? `<span class="badge">${c.price}</span>` : ''}</div>
          ${c.goal ? `<small class="goal">${c.goal.label}</small>` : ''}</div></div>

        <p><b class="lbl">Signature move</b>${c.move}</p>
        <p><b class="lbl">Sample lines</b>${[c.lines.start[0], c.lines.win[0], c.lines.big[0], c.lines.lose[0]].map(l => `“${l}”`).join(' · ')}</p>
        <div class="prompt"><div class="ph"><b>Meshy · text to 3D prompt</b><button class="btn btn-ghost btn-sm" data-copy="m-${c.id}">Copy</button></div><p id="m-${c.id}">${c.meshy}</p></div>
        <div class="prompt"><div class="ph"><b>Card background prompt</b><button class="btn btn-ghost btn-sm" data-copy="b-${c.id}">Copy</button></div><p id="b-${c.id}">${c.bg}</p></div>
      </article>`).join('')}</div>
      <div class="prompt"><div class="ph"><b>Negative prompt (if your Meshy version has the field)</b><button class="btn btn-ghost btn-sm" data-copy="m-neg">Copy</button></div><p id="m-neg">photorealistic, realistic skin, horror, gore, extra limbs, extra fingers, fused hands, text, logo, watermark, multiple characters, background scenery, base, pedestal, weapon, cigarette</p></div>
      <div class="kit-sub">At the table</div>
      <div class="hud kit-hud" style="--c:${dex.color}"><span class="hud-av">${charArt(dex, 58)}</span><div class="hud-main"><div class="hud-top"><div class="jp-pill"><svg aria-hidden="true"><use href="#crown"/></svg>Jackpot <b class="num">5,214</b></div><div class="streak">Streak <span class="flames"><i class="on"></i><i></i><i></i></span></div></div><div class="hud-voice"><b>${dex.name}</b><span>“Winner on the board!”</span></div></div></div>
      <p class="note">Each character has lines for eight moments: deal, swap, small win, win, big win, loss, streak and Hot Hand. Tapping the portrait opens the roster.</p>
    </section>

    <section class="kit-sec"><header><h3>Music and sound packs</h3><span>Loops are generated in code for the prototype; swap in licensed tracks with the same names and tiers</span></header>
      <div class="kit-sub">Music</div>
      <div class="kit-backs">${TRACKS.map(t => `<div class="kb" style="--rar:${RARITY_COLOR[t.rarity]}">${trackArt(t, 92)}<b>${t.name}</b><span class="badge rar">${t.rarity}</span><small>${t.desc}<br>${tierRow(t)}</small></div>`).join('')}</div>
      <div class="kit-sub">Sound effect packs</div>
      <div class="kit-backs">${SFX_PACKS.map(p => `<div class="kb" style="--rar:${RARITY_COLOR[p.rarity]}">${sfxArt(p, 92)}<b>${p.name}</b><span class="badge rar">${p.rarity}</span><small>${p.desc}<br>${tierRow(p)}</small></div>`).join('')}</div>
    </section>

    <section class="kit-sec"><header><h3>Buttons and controls</h3><span>Gold is the main action. Coral is the draw. One gold button per screen</span></header>
      <div class="row-wrap">
        <div class="spec"><button class="btn btn-gold" style="height:54px;font-size:21px;min-width:160px">Play</button><small>Primary · menu</small></div>
        <div class="spec"><button class="btn btn-gold main-btn" style="width:240px">Deal again</button><small>Main action · 56 px</small></div>
        <div class="spec"><button class="btn btn-coral main-btn" style="width:200px">Draw 2</button><small>Draw · Hot Hand</small></div>
        <div class="spec"><button class="btn btn-mint btn-sm">Claim</button><small>Reward</small></div>
        <div class="spec"><button class="btn btn-ghost">How to play</button><small>Ghost</small></div>
        <div class="spec"><button class="btn btn-gold" disabled>Scoring…</button><small>Disabled</small></div>
      </div>
      <div class="row-wrap">
        <div class="spec"><div class="stepper" style="width:200px"><button aria-label="Lower bet">−</button><div class="bv"><b class="num">5 per line</b><small class="num">Total bet 40</small></div><button aria-label="Raise bet">+</button></div><small>Bet stepper</small></div>
        <div class="spec"><button class="sq-btn max">MAX</button><small>Max bet</small></div>
        <div class="spec"><button class="sq-btn">${ICON.bulb}Hint</button><small>Hint</small></div>
        <div class="spec"><div class="seg"><button aria-pressed="true">All</button><button aria-pressed="false">Owned</button><button aria-pressed="false">Earn</button><button aria-pressed="false">Shop</button></div><small>Filter</small></div>
        <div class="spec"><div class="row-wrap" style="gap:8px"><span class="icon-btn">${ICON.back}</span><span class="icon-btn">${ICON.music}</span><span class="icon-btn">${ICON.help}</span><span class="icon-btn">${ICON.gear}</span></div><small>Icon buttons · 38 px</small></div>
        <div class="spec"><button class="switch" role="switch" aria-checked="true"><i></i></button><small>Switch</small></div>
      </div></section>

    <section class="kit-sec"><header><h3>Status and feedback</h3><span>State is shown with color and shape, never color alone</span></header>
      <div class="row-wrap">
        <div class="wallet num">${chip}<span>1,000</span></div>
        <div class="jp-pill"><svg aria-hidden="true"><use href="#crown"/></svg>Jackpot <b class="num">5,214</b></div>
        <div class="streak">Streak <span class="flames"><i></i><i></i><i></i></span></div>
        <div class="streak hot">Streak <span class="flames"><i class="on"></i><i class="on"></i><i></i></span></div>
        <div class="streak hot">Hot Hand · 2 free</div>
      </div>
      <div class="row-wrap">
        <div class="winbox" style="width:200px"><small>Win</small><b class="num">0</b><div class="why">Bet 40 on 8 lines</div></div>
        <div class="winbox won" style="width:200px"><small>Win</small><b class="num">60</b><div class="why">Straight · Flush · Pair</div></div>
      </div>
      <div class="kit-sub">Toasts</div>
      <div class="row-wrap" style="gap:10px"><div class="toast">Middle column: Flush, pays 3×</div><div class="toast gold">Four Corners! +50</div><div class="toast gold">6 winning lines · ×2</div><div class="toast">Streak reset</div></div></section>

    <section class="kit-sec"><header><h3>Celebrations</h3><span>Full-screen moments sit on a dark scrim over the table</span></header>
      <div class="two-col">
        <div class="kit-panel"><div class="overlay"><div class="ov-card"><div class="ov-kicker">Tic-A-Tac Poker</div><div class="ov-title">Big Win</div><div class="ov-amt num">+480</div><div class="ov-sub">12.0× your bet.</div><button class="btn btn-gold">Collect</button></div></div></div>
        <div class="kit-panel"><div class="overlay"><div class="ov-card"><div class="ov-kicker">${STREAK_GOAL} wins in a row</div><div class="ov-title coral">Hot Hand</div>
          <div class="ov-wild">${cardHTML(C(10, 1), { cls: 'static' })}${cardHTML({ w: true }, { cls: 'static wild' })}${cardHTML(C(10, 2), { cls: 'static' })}</div>
          <div class="ov-sub">${FREE_DEALS} free deals at 5 per line. The center card is Wild.</div><button class="btn btn-coral">Start free deals</button></div></div></div>
      </div>
      <p class="note">Big Win at 10× the total bet, Mega Win at 25×, Royal Jackpot on a Mini Royal at max bet. Each fires confetti and a rising arpeggio from the equipped sound pack.</p></section>

    <section class="kit-sec"><header><h3>Icons</h3><span>2 px stroke, round caps, 24 px grid</span></header>
      <div class="icons">${icons.map(k => `<div>${ICON[k]}<span>${k}</span></div>`).join('')}<div><svg aria-hidden="true"><use href="#crown"/></svg><span>crown</span></div><div>${chip}<span>chip</span></div>${[0, 1, 2, 3].map(s => `<div style="color:${s === 1 || s === 2 ? 'var(--suit-red)' : 'var(--cream)'}"><svg aria-hidden="true"><use href="#s${s}"/></svg><span>${SUIT_NAME[s]}</span></div>`).join('')}</div></section>

    <section class="kit-sec"><header><h3>Motion</h3><span>Short, physical, and off when the device asks for reduced motion</span></header>
      <div class="tablewrap"><table class="ktable"><thead><tr><th>Moment</th><th>Duration</th><th>Easing</th><th>Use</th></tr></thead><tbody>
        ${motion.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><code>${r[2]}</code></td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></section>

    <section class="kit-sec"><header><h3>Shape and spacing</h3><span>Radii step up with element size; spacing on a 4 px base</span></header>
      <div class="two-col">
        <div class="radii">${[[10, 'Tag'], [12, 'Card well'], [14, 'Control'], [16, 'Button'], [18, 'Tile'], [22, 'Panel'], [26, 'Board · hero']].map(([r, n]) => `<div style="border-radius:${r}px">${r}<br>${n}</div>`).join('')}</div>
        <div class="space">${[4, 8, 12, 16, 24, 32].map(v => `<div><i style="width:${v * 4}px"></i>${v} px</div>`).join('')}</div>
      </div></section>
  </div>`;
  $$('[data-copy]').forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.copy), text = el.textContent;
    const ok = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = 'Selected'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  });
  const f = $('#kFlip');
  const flip = () => { f.classList.toggle('up'); sfx.flip(); };
  f.onclick = flip; f.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
  setTimeout(flip, 500);
}

/* =========================================================
   Presentation page: phone frame (also used for the portfolio embed)
   ========================================================= */
if (document.getElementById('kit')) renderKit();
else {
const page = $('#page');
if (location.hash === '#embed') { page.classList.add('embed'); document.body.style.background = 'transparent'; }
function fitPhone() {
  const main = $('#pageMain');
  const touchPhone = window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 520;
  page.classList.toggle('bare', touchPhone);
  if (touchPhone) return;
  const m = page.classList.contains('embed') ? 8 : 20;
  const s = Math.min(1, (main.clientHeight - m * 2) / 868, (main.clientWidth - m * 2) / 414);
  const v = Math.max(.3, s).toFixed(4);
  if ($('#phoneSlot').style.getPropertyValue('--s') !== v) $('#phoneSlot').style.setProperty('--s', v);
}
let fitRaf = 0;
const fitSoon = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitPhone); };
window.addEventListener('resize', fitSoon);
if (window.ResizeObserver) new ResizeObserver(fitSoon).observe($('#pageMain'));

if ($('#protoNotes')) $('#protoNotes').innerHTML = `
  <div class="eyebrow">Live mobile prototype</div>
  <h2>Nine cards, eight poker hands</h2>
  <p>Tic-A-Tac Poker puts three-card poker on a tic-tac-toe board. Every row, column and diagonal is a hand. Everything inside the frame is playable.</p>
  <ul>
    <li style="--c:var(--gold)">Bet 1 to 25 per line across all 8 lines, then swap up to 3 cards from the face-down draw tray</li>
    <li style="--c:var(--coral)">Win 3 hands in a row for Hot Hand: free deals with a Wild center card</li>
    <li style="--c:var(--sky)">Multi-line multipliers, Four Corners bonus, and a Royal Jackpot at max bet</li>
    <li style="--c:var(--violet)">15 card backs and 8 felts from Common to Legendary. Some are free, some are earned, some are shop-only.</li>
    <li style="--c:var(--mint)">8 poker characters who react at the table, plus 9 music tracks and 4 sound packs</li>
  </ul>
  <div class="note-roster">${CHARS.map(c => charArt(c, 70)).join('')}</div>`;

/* ---------- Boot ---------- */
go('menu');
fitPhone();
requestAnimationFrame(fitPhone);
}
})();
</script>
